<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon programme salle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#7a3e6c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma Salle">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fbf6f2;--card:#ffffff;--ink:#2b2230;--soft:#6d6170;--line:#eadfd8;
  --plum:#7a3e6c;--plum2:#9d5a8d;--coral:#e0785e;--mint:#3f9c86;--sun:#e8a93a;--red:#c8463b;
  --chip:#f4ebe6;--shadow:0 2px 10px rgba(60,30,50,.08);
  --body:#3b2d40;--hot:#e0785e;--mach:#d9ccd3;--mach2:#a8949f;--good:#3f9c86;--figbg:#fdfaf8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#1c171d;--card:#2a232b;--ink:#f3ecef;--soft:#b9adb6;--line:#3d343e;--plum:#c98ab9;--plum2:#dba6cd;--coral:#f0947c;--mint:#6cc4ac;--sun:#f2bf5e;--red:#ef7a6f;--chip:#352d36;--shadow:0 2px 10px rgba(0,0,0,.35);--body:#efe4ea;--hot:#f0947c;--mach:#4a3f4b;--mach2:#7c6a78;--good:#6cc4ac;--figbg:#231d24}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1c171d;--card:#2a232b;--ink:#f3ecef;--soft:#b9adb6;--line:#3d343e;--plum:#c98ab9;--plum2:#dba6cd;--coral:#f0947c;--mint:#6cc4ac;--sun:#f2bf5e;--red:#ef7a6f;--chip:#352d36;--shadow:0 2px 10px rgba(0,0,0,.35);--body:#efe4ea;--hot:#f0947c;--mach:#4a3f4b;--mach2:#7c6a78;--good:#6cc4ac;--figbg:#231d24}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5;min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.5rem;line-height:1.25}
h2{font-size:1.2rem;margin:1.4rem 0 .6rem}
h3{font-size:1.05rem}
p{margin:.4rem 0}
small,.soft{color:var(--soft)}
.top{padding:calc(18px + env(safe-area-inset-top)) 0 8px}
.top .hello{color:var(--plum);font-weight:600;font-size:.9rem;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.hero{background:linear-gradient(135deg,var(--plum),var(--coral));color:#fff;border:none}
.card.hero .soft{color:#ffffffd0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:none;border-radius:12px;padding:14px 18px;font-size:1rem;font-weight:600;cursor:pointer;background:var(--chip);color:var(--ink);min-height:48px;font-family:inherit}
.btn.primary{background:var(--plum);color:#fff}
.btn.hero{background:#fff;color:var(--plum)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--chip);font-size:.8rem;font-weight:600;color:var(--soft)}
.pill.plum{background:var(--plum);color:#fff}
.pill.mint{background:var(--mint);color:#fff}
.pill.coral{background:var(--coral);color:#fff}
.bar{height:10px;background:#ffffff40;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;background:#fff;border-radius:99px}
.bar.dark{background:var(--chip)}.bar.dark>i{background:var(--mint)}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;font-family:inherit}
textarea{min-height:70px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;font-size:.95rem;color:var(--ink);font-family:inherit}
.choice.on{border-color:var(--plum);background:var(--plum);color:#fff}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:none}
.check input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--plum)}
/* NAV */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs button{flex:1;max-width:160px;background:none;border:none;padding:10px 4px 8px;font-size:.75rem;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit}
nav.tabs button .ic{font-size:1.4rem;line-height:1}
nav.tabs button.on{color:var(--plum);font-weight:700}
/* EXERCISES */
.ex{border-radius:16px;background:var(--card);border:1px solid var(--line);margin:12px 0;overflow:hidden;box-shadow:var(--shadow)}
.ex.done{border-color:var(--mint)}
.ex-head{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.ex-emo{font-size:1.8rem;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--chip);border-radius:12px;flex:none}
.ex.done .ex-emo{background:var(--mint)}
.ex-body{padding:0 16px 16px;display:none}
.ex.open .ex-body{display:block}
.ex-title{font-weight:700}
.how{background:var(--chip);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:.95rem}
.how ul{padding-left:1.1rem}.how li{margin:.25rem 0}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.set{display:flex;align-items:center;gap:8px}
.set .n{width:68px;font-weight:600;color:var(--soft);font-size:.9rem}
.set input{width:84px;text-align:center;padding:10px 6px}
.set .unit{color:var(--soft);font-size:.85rem}
.tick{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:1.4rem;cursor:pointer;margin-left:auto;color:var(--ink)}
.tick.on{background:var(--mint);border-color:var(--mint);color:#fff}
.hint{border-left:4px solid var(--sun);padding:8px 12px;background:var(--chip);border-radius:0 10px 10px 0;margin:8px 0;font-size:.92rem}
.hint.mint{border-color:var(--mint)}.hint.red{border-color:var(--red)}
/* CARDIO */
.segs{margin:8px 0;display:flex;flex-direction:column;gap:6px}
.seg{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--chip);font-size:.92rem}
.seg.now{background:var(--plum);color:#fff}
.seg.past{opacity:.45}
.seg b{min-width:52px}
.big{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;line-height:1.1}
/* TIMER */
#rest{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:var(--plum);color:#fff;border-radius:16px;padding:12px 16px;display:none;align-items:center;gap:12px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#rest.show{display:flex}
body.resting{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
#rest .t{font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums}
#rest button{background:#ffffff30;color:#fff;border:none;border-radius:10px;padding:8px 12px;font-weight:700;font-size:.9rem;font-family:inherit}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.feel .choice{text-align:center;padding:10px 4px;font-size:.88rem}
.list-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.dot{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.dot.A{background:var(--coral)}.dot.B{background:var(--plum2)}.dot.C{background:var(--mint)}
.week{display:flex;gap:6px;margin:8px 0}
.week span{flex:1;height:34px;border-radius:8px;background:#ffffff30;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.week span.on{background:#fff;color:var(--plum)}
details{margin:8px 0}
details summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋ ";color:var(--plum)}
details[open] summary::before{content:"－ "}
.tip-body{padding:0 0 12px;color:var(--ink)}
.tip-body ul{padding-left:1.2rem}.tip-body li{margin:.3rem 0}
.center{text-align:center}
.mt{margin-top:14px}
.chart{display:flex;align-items:flex-end;gap:4px;height:80px;margin:8px 0}
.chart i{flex:1;background:var(--plum2);border-radius:4px 4px 0 0;min-height:4px}
.modal{position:fixed;inset:0;background:rgba(20,10,20,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal-box{background:var(--card);color:var(--ink);border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.fig{margin:6px 0 10px;background:var(--figbg);border:1px solid var(--line);border-radius:14px;padding:6px 6px 8px}
.fig svg{display:block;width:100%;height:auto;max-height:260px}
.fig figcaption{text-align:center;font-weight:700;font-size:1rem;color:var(--plum);min-height:1.5em}
.thumb{margin:0;width:56px;height:44px;flex:none;background:var(--figbg);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.thumb svg{width:100%;height:100%;display:block}
.ex.done .thumb::after{content:"✓";position:absolute;inset:0;background:color-mix(in srgb,var(--mint) 78%,transparent);color:#fff;font-size:1.5rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--soft);justify-content:center;margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gallery button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.gallery button .fig{margin:0 0 4px;padding:2px}
.gallery button b{font-size:.88rem;display:block;line-height:1.25}
.stretch-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stretch-grid .fig{margin:0}
.stretch-grid p{font-size:.85rem;margin:4px 2px 0;line-height:1.35}
.modal-box.wide{max-width:560px;max-height:88vh;overflow:auto}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;font-weight:600;font-size:.95rem;max-width:90vw}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="rest"><div class="grow"><div style="font-size:.8rem;opacity:.85" id="rest-lbl">Récupération</div><div class="t" id="rest-t">1:00</div></div><button type="button" id="rest-plus">+15 s</button><button type="button" id="rest-stop">Passer</button></div>
<nav class="tabs" id="tabs"></nav>
<script src="figures.js"></script>
<script>
'use strict';
const APP_VERSION = '1.3.0';
const KEY = 'ma-salle-v1';

/* ===================== DONNÉES ===================== */
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
let S = load() || { profile: null, logs: [], kg: {}, feel: {}, current: null };
const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const save = () => { S.updatedAt = Date.now(); saveLocal(); cloudPushState(); };

/* ===================== ENREGISTREMENT SUR LE COMPTE ===================== */
// Dans Claude, tout est aussi gardé sur le compte de la personne (espace privé) :
// on retrouve ses séances quel que soit le navigateur ou l'appareil.
const Cloud = { col: null, status: window.claude?.use ? 'loading' : 'local', chain: Promise.resolve(), timer: null };
const logId = l => l.id || (l.id = 'l' + String(l.date || '').replace(/-/g, '') + (l.key || '') + (l.minutes || 0) + 'w' + (l.week || 0));
const stateBody = () => ({ profile: S.profile, kg: S.kg, feel: S.feel, current: S.current, updatedAt: S.updatedAt || 0 });
function cloudQueue(fn) { Cloud.chain = Cloud.chain.then(fn).then(() => { if (Cloud.status !== 'ok') { Cloud.status = 'ok'; paintCloud(); } }).catch(() => { Cloud.status = 'error'; paintCloud(); }); return Cloud.chain; }
function cloudPushState() {
  if (!Cloud.col) return;
  clearTimeout(Cloud.timer);
  Cloud.timer = setTimeout(() => cloudQueue(() => Cloud.col.doc('state').set(JSON.parse(JSON.stringify(stateBody())))), 1200);
}
function cloudPushLog(l) { if (Cloud.col) cloudQueue(() => Cloud.col.doc('log-' + logId(l)).set(JSON.parse(JSON.stringify(l)))); }
function paintCloud() {
  const el = $('#cloud'); if (!el) return;
  el.innerHTML = { ok: '☁️ Séances enregistrées sur votre compte Claude', error: '⚠️ Pas de connexion : vos séances sont gardées sur ce téléphone et seront envoyées plus tard', loading: '☁️ Connexion à votre compte…', local: '📱 Séances gardées sur ce téléphone' }[Cloud.status];
}
async function cloudInit() {
  if (!window.claude?.use) return;
  Cloud.status = 'loading'; paintCloud();
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = db && user ? await user.id() : null;
    if (!uid) { Cloud.status = 'local'; render(); return; }
    const col = db.collection('data/users/' + uid);
    const snap = await Promise.race([col.get(), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 10000))]);
    let remote = null; const rlogs = new Map();
    snap.docs.forEach(d => { const v = d.data(); if (!v) return; if (d.id === 'state') remote = v; else if (d.id.startsWith('log-')) rlogs.set(d.id.slice(4), v); });
    // Fusion : on garde toutes les séances des deux côtés, et les réglages les plus récents
    S.logs.forEach(logId);
    // même jour + même séance = la même séance, même si elle a été enregistrée à deux endroits
    const dk = l => (l.date || '') + '|' + (l.key || '');
    const local = new Set(S.logs.map(l => l.id)), localDK = new Set(S.logs.map(dk));
    const remoteDK = new Set([...rlogs.values()].map(dk));
    const missingRemote = S.logs.filter(l => !rlogs.has(l.id) && !remoteDK.has(dk(l)));
    rlogs.forEach((v, id) => { if (!local.has(id) && !localDK.has(dk(v))) S.logs.push({ ...v, id }); });
    S.logs.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.at || 0) - (b.at || 0));
    const localNewer = !remote || (S.profile && (S.updatedAt || 0) > (remote.updatedAt || 0));
    if (remote && !localNewer && remote.profile) { S.profile = remote.profile; S.kg = remote.kg || {}; S.feel = remote.feel || {}; S.current = remote.current || null; S.updatedAt = remote.updatedAt; }
    else if (remote && remote.kg) S.kg = { ...remote.kg, ...S.kg };
    Cloud.col = col; Cloud.status = 'ok';
    saveLocal();
    missingRemote.forEach(cloudPushLog);
    if (localNewer && S.profile) cloudPushState();
    if (S.current && view === 'home') view = 'session';
    render();
    if (missingRemote.length && rlogs.size) toast(`${missingRemote.length} séance${missingRemote.length > 1 ? 's' : ''} de ce téléphone ajoutée${missingRemote.length > 1 ? 's' : ''} à votre compte`);
  } catch (e) { Cloud.status = 'error'; render(); }
}
let view = 'home';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
function ask(msg, yes = 'Oui', no = 'Annuler') {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="row mt"><button type="button" class="btn grow" data-r="0">${esc(no)}</button><button type="button" class="btn primary grow" data-r="1">${esc(yes)}</button></div></div>`;
    d.onclick = e => { const b = e.target.closest('[data-r]'); if (!b && e.target !== d) return; d.remove(); res(b?.dataset.r === '1'); };
    document.body.append(d); d.querySelector('[data-r="1"]').focus();
  });
}
function toast(msg) { document.querySelectorAll('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2600); }

/* ===================== EXERCICES ===================== */
// Chaque exercice : réglage de la machine, mouvement, respiration, erreurs à éviter, version plus facile.
const EX = {
  presse: { emo: '🦵', name: 'Presse à cuisses', zone: 'Cuisses, fessiers',
    setup: 'Dossier réglé pour que les genoux forment un angle droit en bas. Pieds à plat au milieu du plateau, largeur du bassin.',
    how: ['Poussez avec les talons jusqu\'à jambes presque tendues (ne verrouillez pas les genoux).', 'Redescendez lentement en 3 secondes.', 'Le bas du dos reste collé au dossier.'],
    breath: 'Soufflez en poussant, inspirez en revenant.',
    avoid: 'Genoux qui rentrent vers l\'intérieur, fesses qui décollent du siège.',
    easy: 'Moins de poids et amplitude plus courte.' },
  legcurl: { emo: '🦿', name: 'Leg curl assis (arrière des cuisses)', zone: 'Ischio-jambiers',
    setup: 'Genoux alignés avec l\'axe de rotation de la machine. Le boudin se place juste au-dessus des chevilles. Bloquez les cuisses avec l\'appui.',
    how: ['Pliez les genoux en ramenant les talons sous le siège.', 'Marquez une petite pause.', 'Remontez lentement.'],
    breath: 'Soufflez en pliant, inspirez en revenant.',
    avoid: 'Cambrer ou se tirer avec les bras.',
    easy: 'Charge plus légère, mouvement plus court.' },
  pont: { emo: '🍑', name: 'Pont fessier au sol', zone: 'Fessiers, bas du dos',
    setup: 'Sur un tapis, allongée sur le dos, genoux pliés, pieds à plat à la largeur du bassin, bras le long du corps.',
    how: ['Serrez les fessiers et montez le bassin jusqu\'à aligner genoux, hanches et épaules.', 'Tenez 2 secondes en haut.', 'Redescendez vertèbre par vertèbre.'],
    breath: 'Soufflez en montant (en rentrant doucement le ventre), inspirez en descendant.',
    avoid: 'Cambrer le bas du dos en haut : c\'est le fessier qui travaille, pas les lombaires.',
    easy: 'Moins haut. Plus difficile : un disque de 5 kg sur les hanches.' },
  abducteurs: { emo: '↔️', name: 'Machine abducteurs (écarter)', zone: 'Fessiers (côtés des hanches)',
    setup: 'Assise bien au fond, les coussins à l\'extérieur des genoux.',
    how: ['Écartez les jambes de façon contrôlée.', 'Revenez lentement sans laisser claquer les poids.'],
    breath: 'Soufflez en écartant.',
    avoid: 'Donner des à-coups.',
    easy: 'Amplitude plus petite.' },
  adducteurs: { emo: '🔁', name: 'Machine adducteurs (serrer)', zone: 'Intérieur des cuisses',
    setup: 'Assise au fond, coussins à l\'intérieur des genoux. Commencez avec un écart confortable, pas maximal.',
    how: ['Serrez les jambes jusqu\'à ce que les coussins se touchent presque.', 'Revenez lentement.'],
    breath: 'Soufflez en serrant.',
    avoid: 'Trop écarter au départ.',
    easy: 'Écart de départ plus petit.' },
  mollets: { emo: '🦶', name: 'Mollets debout', zone: 'Mollets, chevilles',
    setup: 'Debout, l\'avant des pieds sur une marche ou un step, une main sur un support pour l\'équilibre.',
    how: ['Montez sur la pointe des pieds le plus haut possible.', 'Redescendez lentement, talons légèrement sous la marche.'],
    breath: 'Respiration libre et régulière.',
    avoid: 'Rebondir.',
    easy: 'Pieds à plat au sol plutôt que sur une marche.' },
  tirage: { emo: '⬇️', name: 'Tirage vertical (poulie haute)', zone: 'Dos, bras',
    setup: 'Cale-cuisses réglé pour bloquer les jambes. Prise un peu plus large que les épaules, paumes vers l\'avant.',
    how: ['Buste très légèrement penché en arrière, poitrine ouverte.', 'Tirez la barre vers le haut de la poitrine en abaissant les épaules.', 'Remontez lentement, bras presque tendus.'],
    breath: 'Soufflez en tirant.',
    avoid: 'Tirer derrière la nuque, se balancer.',

function cardioPlan(kind, phase, gentle) {
  let segs;

    { m: 3, txt: 'Marche tranquille', set: '4,0 km/h · incl. 1 %', rpe: 2 },

    { m: 3, txt: 'Tranquille', set: 'Résistance 2–3', rpe: 2 },
    { m: 5, txt: 'Régulier', set: 'Résistance 3–5', rpe: 3 }];
  else if (kind === 'tapis') {
    if (phase === 1) segs = [{ m: 12, txt: 'Marche en côte régulière', set: '4,5 à 5,0 km/h · incl. 4 %', rpe: 5 }, { m: 3, txt: 'Retour au calme', set: '4,0 km/h · incl. 0 %', rpe: 2 }];
    else if (phase === 2) segs = [{ m: 4, txt: 'Mise en route', set: '4,8 km/h · incl. 3 %', rpe: 4 },
      ...rep(3, [{ m: 3, txt: 'Côte', set: '4,8 km/h · incl. 7 %', rpe: 6 }, { m: 2, txt: 'Plat', set: '4,8 km/h · incl. 2 %', rpe: 4 }]),
      { m: 1, txt: 'Retour au calme', set: '4,0 km/h · incl. 0 %', rpe: 2 }];
    else if (phase === 4) segs = [{ m: 4, txt: 'Mise en route', set: '5,0 km/h · incl. 3 %', rpe: 4 },
      ...rep(5, [{ m: 3, txt: 'Longue côte (en marchant)', set: '5,0 km/h · incl. 10 à 12 %', rpe: 7 }, { m: 2, txt: 'Récupération', set: '4,5 km/h · incl. 2 %', rpe: 4 }]),
      { m: 2, txt: 'Retour au calme', set: '4,0 km/h · incl. 0 %', rpe: 2 }];
    else segs = [{ m: 4, txt: 'Mise en route', set: '5,0 km/h · incl. 3 %', rpe: 4 },
      ...rep(6, [{ m: 1.5, txt: 'Côte raide (en marchant)', set: '5,0 à 5,5 km/h · incl. 8 à 10 %', rpe: 7 }, { m: 2, txt: 'Récupération', set: '4,5 km/h · incl. 2 %', rpe: 4 }]),
      { m: 2, txt: 'Retour au calme', set: '4,0 km/h · incl. 0 %', rpe: 2 }];
  } else if (kind === 'velo') {
    if (phase === 1) segs = [{ m: 12, txt: 'Pédalage régulier', set: 'Résistance faible · 70–80 tr/min', rpe: 4 }, { m: 3, txt: 'Retour au calme', set: 'Résistance minimale', rpe: 2 }];
    else if (phase === 2) segs = [{ m: 5, txt: 'Mise en route', set: 'Résistance faible', rpe: 3 },
      ...rep(5, [{ m: 1, txt: 'Plus dur', set: '+2 à 3 niveaux de résistance', rpe: 6 }, { m: 2, txt: 'Facile', set: 'Résistance de départ', rpe: 4 }]), { m: 2, txt: 'Retour au calme', set: 'Résistance minimale', rpe: 2 }];
    else if (phase === 4) segs = [{ m: 4, txt: 'Mise en route', set: 'Résistance faible', rpe: 3 },
      ...rep(5, [{ m: 3, txt: 'Effort soutenu', set: '+4 à 5 niveaux', rpe: 7 }, { m: 2, txt: 'Facile', set: 'Résistance de départ', rpe: 4 }]), { m: 2, txt: 'Retour au calme', set: 'Résistance minimale', rpe: 2 }];
    else segs = [{ m: 4, txt: 'Mise en route', set: 'Résistance faible', rpe: 3 },
      ...rep(4, [{ m: 3, txt: 'Effort soutenu', set: '+3 à 4 niveaux', rpe: 7 }, { m: 2, txt: 'Facile', set: 'Résistance de départ', rpe: 4 }]), { m: 2, txt: 'Retour au calme', set: 'Résistance minimale', rpe: 2 }];
  }
  if (gentle) segs = segs.filter((s, i, a) => !(s.rpe >= 6 && a.slice(0, i).filter(x => x.rpe >= 6).length >= 2)).map(s => s.rpe >= 6 ? { ...s, rpe: s.rpe - 1, set: s.set + ' (un peu moins)' } : s);
  return segs;
}

function doneCount() { return S.logs.length; }
function progWeek() { const d = S.profile?.days || 3; return Math.max(1, Math.floor(doneCount() / d) + 1 + (S.profile?.offset || 0)); }

function buildSession(key, gentle) {
  const week = progWeek(), ph = phaseOf(week), sess = SESSIONS[key];

    key, date: today(), week, phase: ph.n, gentle: !!gentle, startedAt: Date.now(),
    warm: { kind: sess.warm, done: false },
    ex: sess.ex.map(kneesOk).map(id => ({ id, sets: Array.from({ length: id === 'equilibre' ? 2 : sets }, () => ({ kg: noKg(id) ? '' : (S.kg[id] ?? ''), reps: '', done: false })), feel: null })),
    cardio: { kind: sess.cardio, done: false },
    stretch: false, feel: null, note: '',
  };
}

function viewTips() {
  const T = [
    ['Pourquoi des machines et des charges ?', `<ul><li>Avec la baisse des œstrogènes, on perd plus vite du muscle et de la densité osseuse. Le renforcement musculaire progressif est la façon la plus efficace de freiner ces deux pertes.</li><li>Les os réagissent aux charges qui augmentent peu à peu et aux petits impacts (montée sur step, marche rapide) : c'est pour cela que le programme fait monter les charges.</li><li>Les machines guident le mouvement : idéal pour débuter en sécurité.</li></ul>`],
    ['Bien doser l\'effort', `<ul><li><b>Renforcement</b> : à la fin d'une série, vous devez pouvoir faire encore 1 à 3 répétitions propres. Si vous pourriez en faire 5 de plus, c'est trop léger : un cran de plus.</li><li><b>Cardio</b> : le test de la parole. Facile = on discute ; moyen = phrases courtes ; dur = quelques mots.</li><li>Des courbatures 24 à 72 h après sont normales au début. Une douleur vive, articulaire ou qui dure ne l'est pas.</li></ul>`],
    ['Bouffées de chaleur à la salle', `<ul><li>Tenue en couches légères, gourde d'eau fraîche, petite serviette.</li><li>Placez-vous près d'un ventilateur ou d'une fenêtre ; évitez les heures où la salle est surchauffée.</li><li>Évitez café très chaud, alcool ou plat épicé juste avant la séance.</li><li>Si une bouffée arrive : ralentissez, respirez lentement, buvez, puis reprenez.</li></ul>`],
    ['Fatigue, sommeil, humeur', `<ul><li>Les jours sans, choisissez la version « Jour en douceur » : on garde l'habitude, c'est l'essentiel.</li><li>L'activité physique régulière aide souvent le sommeil et l'humeur ; évitez seulement les séances intenses tard le soir si votre sommeil est fragile.</li><li>Les règles irrégulières de la périménopause peuvent jouer sur l'énergie : notez-le dans la séance pour repérer vos tendances.</li></ul>`],
    ['Retour veineux et jambes lourdes', `<ul><li>La marche (même en côte), le vélo, l'elliptique et les exercices de mollets font travailler la « pompe du mollet » : ils aident le sang à remonter. Ils sont vos alliés.</li><li>Pas de course ni de sauts : ce programme n'en contient pas.</li><li>Pendant les pauses, ne restez pas immobile debout : bougez les chevilles, marchez quelques pas.</li><li>Ne bloquez jamais la respiration pendant l'effort : soufflez en poussant.</li><li>Buvez souvent, évitez la grosse chaleur (sauna, hammam, douche très chaude juste après) et les vêtements qui serrent à la taille ou sous le genou.</li><li>Demandez à votre médecin si des bas de contention sont conseillés pour le sport.</li><li>Le soir d'une séance : 10 minutes jambes surélevées.</li></ul><div class="hint red"><b>Consultez rapidement</b> en cas de mollet douloureux, gonflé, chaud ou rouge d'un seul côté, ou d'essoufflement soudain.</div>`],
    ['Le périnée', `<ul><li>Soufflez toujours pendant l'effort et ne bloquez jamais la respiration.</li><li>Si vous ressentez une pesanteur ou des fuites (en toussant, en sautant, en soulevant), ce n'est pas une fatalité : une rééducation chez un·e kiné ou une sage-femme est très efficace. Gardez alors des charges modérées en attendant.</li><li>Ce programme ne contient ni sauts ni abdos « crunch », plus durs pour le périnée.</li></ul>`],
    ['Manger pour progresser', `<ul><li>Une source de protéines à chaque repas (œufs, poisson, viande, yaourt, fromage blanc, légumineuses, tofu) : le muscle en a besoin pour se construire, surtout après 50 ans.</li><li>Calcium (produits laitiers, eaux riches en calcium, amandes, légumes verts) et vitamine D : demandez à votre médecin si un dosage ou un complément est utile pour vous.</li><li>Buvez avant, pendant et après la séance.</li></ul>`],
    ['Le bon rythme de la semaine', `<ul><li>Au moins un jour de repos entre deux séances au début.</li><li>Les autres jours, marchez : 20 à 30 minutes, c'est déjà beaucoup.</li><li>Exemple avec 3 séances : lundi A, mercredi B, vendredi C. Avec 2 : mardi et vendredi, les séances tournent A, B, C.</li><li>Une semaine manquée ? Le programme ne saute rien : il reprend là où vous en étiez.</li></ul>`],
    ['Quand arrêter et consulter', `<div class="hint red"><b>Arrêtez immédiatement et demandez un avis médical</b> en cas de douleur ou serrement dans la poitrine, d'essoufflement anormal, de palpitations, de vertige, de malaise ou d'une douleur vive dans une articulation.</div><p>Évitez aussi la séance en cas de fièvre ou de grosse infection : reprenez 1 à 2 jours après la fin de la fièvre, en douceur.</p>`],
    ['À la salle, les premières fois', `<ul><li>Demandez à un coach de la salle de vous montrer les réglages des machines : c'est son métier et c'est gratuit dans la plupart des salles.</li><li>Les machines n'ont pas toutes les mêmes chiffres : notez dans l'appli le numéro de la plaque ou les kg affichés, c'est votre repère sur <i>cette</i> machine.</li><li>Si une machine du programme n'existe pas dans votre salle, demandez l'équivalent au coach.</li></ul>`],
  ];
  return `<div class="top"><h1>Conseils</h1><p class="soft">Spécial femmes de plus de 50 ans, périménopause et reprise du sport.</p></div>
  <div class="card"><h3>Mes exercices en images</h3><p class="soft" style="font-size:.92rem">Touchez un dessin pour le voir bouger. Vous cherchez une machine chez Jims ? Montrez le dessin à quelqu'un de l'équipe.</p>
    <div class="gallery mt">${Object.keys(EX).map(id => `<button type="button" data-gal="${id}">${FIG.svg(id, 'fig', true)}<b>${EX[id].name}</b></button>`).join('')}${['tapis', 'velo', 'ellip'].map(id => `<button type="button" data-gal="${id}">${FIG.svg(id, 'fig', true)}<b>${{ tapis: 'Tapis de marche', velo: 'Vélo', ellip: 'Elliptique' }[id]}</b></button>`).join('')}</div></div>
  <div class="card">${T.map(([t, b], i) => `<details ${i === 0 ? 'open' : ''}><summary>${t}</summary><div class="tip-body">${b}</div></details>`).join('')}</div>
  <p class="soft center" style="font-size:.85rem">Ces conseils sont généraux et ne remplacent pas l'avis de votre médecin.</p>`;
}

/* ---------- Réglages ---------- */
function viewSettings() {
  const p = S.profile;
  return `<div class="top"><h1>Réglages</h1></div>
  <div class="card"><label class="f" for="st-name">Prénom</label><input type="text" id="st-name" value="${esc(p.name)}">
    <label class="f">Séances par semaine</label><div class="choices" id="st-days">${[2, 3].map(d => `<button type="button" class="choice ${p.days === d ? 'on' : ''}" data-d="${d}">${d} séances</button>`).join('')}</div>
    ${levelForm(p)}
    <label class="f" for="st-week">Semaine du programme</label>
    <select id="st-week">${Array.from({ length: 16 }, (_, i) => i + 1).map(w => `<option value="${w}" ${progWeek() === w ? 'selected' : ''}>Semaine ${w}${w > 12 ? ' (Élan)' : ''} · phase ${phaseOf(w).n} ${phaseOf(w).name}</option>`).join('')}</select>
    <button type="button" class="btn primary block mt" id="st-save">Enregistrer</button></div>
  <div class="card"><h3>Sauvegarde</h3><p id="cloud" style="font-size:.95rem;font-weight:600"></p><p class="soft" style="font-size:.92rem">Une copie de secours en plus, de temps en temps, ne fait pas de mal (Fichiers, iCloud, e-mail).</p>
    <div class="row wrap mt"><button type="button" class="btn grow" id="st-export">⬇️ Exporter</button><label class="btn grow" for="st-import" style="cursor:pointer">⬆️ Restaurer</label><input type="file" id="st-import" accept=".json,application/json" hidden></div>
    <div id="st-out" hidden><p class="soft mt" style="font-size:.9rem">Si aucun fichier n'a été enregistré, copiez ce texte et gardez-le (note, e-mail à vous-même).</p><textarea id="st-json" readonly></textarea><button type="button" class="btn block mt" id="st-copy">Copier la sauvegarde</button></div>
    <details><summary>Restaurer en collant un texte</summary><textarea id="st-pasted" placeholder="Collez ici le texte de sauvegarde"></textarea><button type="button" class="btn block mt" id="st-paste">Restaurer</button></details></div>
  <div class="card"><h3>Installer sur le téléphone</h3><p style="font-size:.95rem"><b>iPhone</b> : dans Safari, touchez Partager puis « Sur l'écran d'accueil ».<br><b>Android</b> : dans Chrome, menu ⋮ puis « Installer l'application » ou « Ajouter à l'écran d'accueil ».</p><p class="soft" style="font-size:.9rem">Elle marche ensuite sans connexion, même dans une salle sans réseau.</p></div>
  <div class="card"><h3>Recommencer</h3><button type="button" class="btn ghost block mt" id="st-reset">Effacer toutes mes données</button></div>
  <p class="soft center" style="font-size:.8rem">Version ${APP_VERSION}</p>`;
}

/* ===================== ÉVÉNEMENTS ===================== */
function bind() {
  document.querySelectorAll('[data-tab-go]').forEach(b => b.onclick = () => { view = b.dataset.tabGo; render(); });
  if (view === 'home') {
    let gentle = false;
    document.querySelectorAll('#mood .choice').forEach(b => b.onclick = () => { gentle = b.dataset.g === '1'; document.querySelectorAll('#mood .choice').forEach(x => x.classList.toggle('on', x === b)); $('#mood-hint').style.display = gentle ? 'block' : 'none'; });
    const start = async k => { if (S.current && !(await ask('Une séance est déjà en cours. La remplacer par une nouvelle ?', 'Remplacer'))) return; stopCardio(true); S.current = buildSession(k, gentle || daysSinceLast() >= 10); openEx = 'cd-warm'; save(); view = 'session'; render(); window.scrollTo(0, 0); };
    $('#go').onclick = () => start(nextKey());
    $('#lv-save') && bindLevelForm();
    if ($('#lv-save')) $('#lv-save').onclick = () => { applyLevel(readLevelForm()); save(); toast('C\'est enregistré'); render(); };
    if ($('#lvl-up')) $('#lvl-up').onclick = async () => {
      const ph = phaseOf(progWeek()), next = PHASE_START[ph.n + 1];
      if (await ask(`Passer à la phase ${ph.n + 1} ? Les séries, répétitions et le cardio changent dès la prochaine séance. Vous pourrez revenir en arrière dans Réglages.`, 'Passer à la suite')) { setStartWeek(next); save(); toast(`Phase ${ph.n + 1} · ${phaseOf(next).name} 💪`); render(); }
    };
    document.querySelectorAll('[data-other]').forEach(b => b.onclick = () => start(b.dataset.other));
  }
  if (view === 'session' && S.current) bindSession();
  if (view === 'settings') bindSettings();
  document.querySelectorAll('[data-gal]').forEach(b => b.onclick = () => showEx(b.dataset.gal));
}
function showEx(id) {
  const x = EX[id];
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="modal-box wide" role="dialog" aria-modal="true"><div class="row"><h3 class="grow">${x ? x.name : { tapis: 'Tapis de marche', velo: 'Vélo', ellip: 'Elliptique' }[id]}</h3><button type="button" class="btn sm" data-close>Fermer</button></div>
    ${FIG.svg(id)}${x ? LEGEND + `<div class="how"><b>Réglage</b><p>${x.setup}</p><b>Mouvement</b><ul>${x.how.map(h => `<li>${h}</li>`).join('')}</ul><p>🌬️ <b>Respiration :</b> ${x.breath}</p><p>⚠️ <b>À éviter :</b> ${x.avoid}</p></div>` : '<p class="soft">Les consignes de vitesse et de résistance sont dans chaque séance.</p>'}</div>`;
  d.onclick = e => { if (e.target === d || e.target.closest('[data-close]')) d.remove(); };
  document.body.append(d);
}
function daysSinceLast() { const l = S.logs[S.logs.length - 1]; return l ? Math.round((new Date(today()) - new Date(l.date)) / 864e5) : 0; }
function scrollToOpen() { requestAnimationFrame(() => { const el = typeof openEx === 'number' ? document.querySelector(`[data-ex-wrap="${openEx}"]`) : openEx && document.querySelector(`[data-open="${openEx}"]`); el?.scrollIntoView({ block: 'start', behavior: 'smooth' }); }); }
function bindSession() {
  const c = S.current, ph = phaseOf(c.week);
  document.querySelectorAll('[data-open]').forEach(h => h.onclick = () => {
    const k = h.dataset.open, v = /^\d+$/.test(k) ? +k : k;
    openEx = openEx === v ? null : v; render();
    if (openEx !== null) document.querySelector(`[data-open="${k}"]`)?.scrollIntoView({ block: 'start', behavior: 'smooth' });
  });
  document.querySelectorAll('[data-kg]').forEach(inp => inp.oninput = () => {
    const [i, j] = inp.dataset.kg.split('.').map(Number); c.ex[i].sets[j].kg = inp.value.trim();
    // la charge saisie se propage aux séries suivantes encore vides
    for (let k = j + 1; k < c.ex[i].sets.length; k++) if (!c.ex[i].sets[k].done) { c.ex[i].sets[k].kg = inp.value.trim(); const o = document.querySelector(`[data-kg="${i}.${k}"]`); if (o) o.value = inp.value.trim(); }
    save();
  });
  document.querySelectorAll('[data-tick]').forEach(b => b.onclick = () => {
    const [i, j] = b.dataset.tick.split('.').map(Number), set = c.ex[i].sets[j];
    set.done = !set.done; save();
    const allDone = c.ex[i].sets.every(s => s.done);
    if (set.done && !allDone) startRest(ph.rest);
    else if (allDone) { stopRest(); toast('Exercice terminé 👏'); if (!c.ex[i].feel) { render(); return; } openEx = c.ex.findIndex(e => !e.sets.every(s => s.done)); if (openEx < 0) openEx = 'cd-cardio'; }
    render(); if (allDone && c.ex[i].feel) scrollToOpen();
  });
  document.querySelectorAll('[data-efeel]').forEach(b => b.onclick = () => {
    const [i, k] = b.dataset.efeel.split('.'); c.ex[+i].feel = k; save();
    if (c.ex[+i].sets.every(s => s.done)) { openEx = c.ex.findIndex(e => !e.sets.every(s => s.done)); if (openEx < 0) openEx = 'cd-cardio'; scrollToOpen(); }
  });
  document.querySelectorAll('[data-cd-start]').forEach(b => b.onclick = () => { beep(1); startCardio(b.dataset.cdStart); });
  document.querySelectorAll('[data-cd-pause]').forEach(b => b.onclick = () => stopCardio());
  document.querySelectorAll('[data-cd-end]').forEach(b => b.onclick = () => {
    const w = b.dataset.cdEnd; if (cardioRun?.which === w) stopCardio(true);
    c[w].done = true; if (!c[w].elapsed) c[w].elapsed = total(cardioPlan(c[w].kind, c.phase, c.gentle)) * 60;
    openEx = w === 'warm' ? 0 : 'stretch'; save(); render(); scrollToOpen();
  });
  document.querySelectorAll('[data-cd-redo]').forEach(b => b.onclick = () => { const w = b.dataset.cdRedo; c[w].done = false; c[w].elapsed = 0; save(); render(); });
  $('[data-stretch]').onclick = () => { c.stretch = !c.stretch; save(); render(); };
  document.querySelectorAll('[data-sfeel]').forEach(b => b.onclick = () => { c.feel = b.dataset.sfeel; c.note = $('#snote').value; save(); render(); });
  $('#snote').oninput = e => { c.note = e.target.value; save(); };
  $('#finish').onclick = finish;
  $('#abandon').onclick = async () => { if (await ask('Abandonner cette séance ? Elle ne sera pas comptée.', 'Abandonner', 'Continuer')) { stopCardio(true); stopRest(); S.current = null; save(); view = 'home'; render(); } };
}
async function finish() {
  const c = S.current;
  const anySet = c.ex.some(e => e.sets.some(s => s.done));
  if (!anySet && !c.cardio.done && !(await ask('Aucun exercice n\'est coché. Terminer quand même ?', 'Terminer'))) return;
  stopCardio(true); stopRest();
  c.ex.forEach(e => {
    const kgs = e.sets.filter(s => s.done && s.kg).map(s => s.kg);
    if (kgs.length) S.kg[e.id] = kgs[kgs.length - 1];
    if (e.feel) S.feel[e.id] = e.feel;
  });
  const minutes = Math.max(10, Math.round((Date.now() - c.startedAt) / 60000));
  S.logs.push({ id: 'l' + Date.now().toString(36), at: Date.now(), key: c.key, date: today(), week: c.week, phase: c.phase, gentle: c.gentle, feel: c.feel, note: c.note.trim(), minutes: Math.min(minutes, 120),
    ex: c.ex.map(e => ({ id: e.id, kg: e.sets.filter(s => s.done && s.kg).map(s => s.kg).pop() || '', sets: e.sets.filter(s => s.done).length, feel: e.feel })), cardio: c.cardio.done });
  S.current = null; openEx = null; save(); cloudPushLog(S.logs[S.logs.length - 1]);
  const n = S.logs.length;
  const before = phaseOf(c.week), after = phaseOf(progWeek());
  view = 'home'; render(); window.scrollTo(0, 0);
  toast(n === 1 ? 'Première séance enregistrée. Bravo !' : after.n !== before.n ? `Nouvelle étape : phase ${after.n} · ${after.name} 💪` : 'Séance enregistrée. Bravo !');
}
function bindSettings() {
  let days = S.profile.days;
  document.querySelectorAll('#st-days .choice').forEach(b => b.onclick = () => { days = +b.dataset.d; document.querySelectorAll('#st-days .choice').forEach(x => x.classList.toggle('on', x === b)); });
  bindLevelForm();
  $('#st-save').onclick = () => {
    const wk = +$('#st-week').value, wkChanged = wk !== progWeek();
    S.profile.name = $('#st-name').value.trim(); S.profile.days = days;
    applyLevel(readLevelForm(), !wkChanged);
    if (wkChanged) setStartWeek(wk);
    save(); toast('Enregistré'); render();
  };
  $('#st-export').onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ma-salle-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); } catch {}
    $('#st-out').hidden = false; $('#st-json').value = JSON.stringify(S);
  };
  $('#st-copy').onclick = async () => { const t = $('#st-json'); try { await navigator.clipboard.writeText(t.value); toast('Copié : collez-le dans une note ou un e-mail'); } catch { t.select(); toast('Texte sélectionné : copiez-le'); } };
  $('#st-paste').onclick = async () => { const txt = $('#st-pasted').value.trim(); if (!txt) return; try { const d = JSON.parse(txt); if (!d.profile || !Array.isArray(d.logs)) throw 0; if (await ask('Remplacer les données de ce téléphone par cette sauvegarde ?', 'Remplacer')) { S = { kg: {}, feel: {}, current: null, ...d }; save(); S.logs.forEach(l => { logId(l); cloudPushLog(l); }); toast('Sauvegarde restaurée'); view = 'home'; render(); } } catch { toast('Ce texte n\'est pas une sauvegarde valide'); } };
  $('#st-import').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (!d.profile || !Array.isArray(d.logs)) throw 0; if (await ask('Remplacer les données de ce téléphone par cette sauvegarde ?', 'Remplacer')) { S = { kg: {}, feel: {}, current: null, ...d }; save(); S.logs.forEach(l => { logId(l); cloudPushLog(l); }); toast('Sauvegarde restaurée'); view = 'home'; render(); } }
    catch { toast('Ce fichier n\'est pas une sauvegarde valide'); }
  };
  $('#st-reset').onclick = async () => { if (await ask('Effacer tout votre historique ? Pensez à exporter avant.', 'Effacer') && await ask('Vraiment tout effacer ?', 'Tout effacer')) { const old = S.logs.slice(); try { localStorage.removeItem(KEY); } catch {} S = { profile: null, logs: [], kg: {}, feel: {}, current: null }; if (Cloud.col) { old.forEach(l => cloudQueue(() => Cloud.col.doc('log-' + logId(l)).delete())); cloudQueue(() => Cloud.col.doc('state').delete()); } view = 'home'; render(); } };
}

if (S.current) { view = 'session'; openEx = null; }
render();
FIG.start();
cloudInit();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden && cardioRun) tickCardio(); });
</script>
