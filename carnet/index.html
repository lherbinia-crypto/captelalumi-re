<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet Prof">
<meta name="theme-color" content="#1d2433">
<meta name="description" content="Carnet du professeur : élèves, carnet de cotes, présences, journal de classe et DAccE. Fonctionne hors ligne sur iPad.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Carnet du prof</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f3f4f7;--surface:#fff;--surface-2:#f6f7f9;--text:#1b1e24;--muted:#667085;--line:#e3e6ec;
  --accent:#2f6fec;--accent-soft:#e8efff;--on-accent:#fff;
  --ok:#16884a;--ok-soft:#e3f5ea;--warn:#a86400;--warn-soft:#fff2d9;--bad:#c93838;--bad-soft:#fde8e8;
  --info:#6b4fd8;--info-soft:#efeaff;--neutral-soft:#eceef2;
  --side:#1d2433;--side-2:#2a3347;--side-text:#eef1f7;--side-muted:#9aa4b8;
  --radius:12px;--shadow:0 1px 2px rgb(16 24 40/.06),0 2px 10px rgb(16 24 40/.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b;--surface:#1b1f27;--surface-2:#222732;--text:#e9ecf2;--muted:#9aa3b3;--line:#2e3442;
  --accent:#6b9bff;--accent-soft:#1f2b47;--on-accent:#0b1020;
  --ok:#4cc77f;--ok-soft:#173326;--warn:#f0b54a;--warn-soft:#3a2d12;--bad:#ff7a7a;--bad-soft:#3d1c1c;
  --info:#a993ff;--info-soft:#29224a;--neutral-soft:#2a2f3a;
  --side:#0d1016;--side-2:#1d2330;--side-text:#e9ecf2;--side-muted:#8a93a5;
  --shadow:0 1px 2px rgb(0 0 0/.3);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12151b;--surface:#1b1f27;--surface-2:#222732;--text:#e9ecf2;--muted:#9aa3b3;--line:#2e3442;
  --accent:#6b9bff;--accent-soft:#1f2b47;--on-accent:#0b1020;
  --ok:#4cc77f;--ok-soft:#173326;--warn:#f0b54a;--warn-soft:#3a2d12;--bad:#ff7a7a;--bad-soft:#3d1c1c;
  --info:#a993ff;--info-soft:#29224a;--neutral-soft:#2a2f3a;
  --side:#0d1016;--side-2:#1d2330;--side-text:#e9ecf2;--side-muted:#8a93a5;
  --shadow:0 1px 2px rgb(0 0 0/.3);color-scheme:dark;
}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
#app{display:grid;grid-template-columns:270px 1fr;height:100vh;height:100dvh}

/* Sidebar */
#sidebar{background:var(--side);color:var(--side-text);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand-mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#3d7bff,#7a5af8);display:grid;place-items:center;font-weight:700;color:#fff}
.brand b{display:block;font-size:17px}
.brand small{color:var(--side-muted);font-size:12px}
.side-h{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-muted);padding:8px 10px 6px}
.cls-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:10px;min-height:48px}
.cls-item:hover{background:var(--side-2)}
.cls-item.active{background:var(--side-2);box-shadow:inset 3px 0 0 var(--dot,#3d7bff)}
.cls-item .dot{width:12px;height:12px;border-radius:50%;background:var(--dot);flex:none}
.cls-item .nm{font-weight:600;display:block}
.cls-item .sub{font-size:12.5px;color:var(--side-muted)}
.side-btn{display:flex;align-items:center;gap:10px;width:100%;border:1px dashed #ffffff33;background:none;border-radius:10px;padding:10px;margin-top:8px;color:var(--side-text);min-height:44px}
.side-foot{margin-top:auto;padding-top:14px;display:grid;gap:6px}
.side-foot .side-btn{border-style:solid;border-color:#ffffff1f}
.side-foot .side-btn.active{background:var(--side-2)}
.backup-warn{font-size:12.5px;color:#ffd27a;padding:6px 10px}

/* Main */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 0 16px}
.top-row{display:flex;align-items:center;gap:10px;min-height:44px}
.top-row h1{font-size:21px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-row h1 small{font-weight:400;color:var(--muted);font-size:15px;margin-left:6px}
.menu-btn{display:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap;min-height:44px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
#view{flex:1;overflow:auto;padding:16px calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) 16px;-webkit-overflow-scrolling:touch}

/* Common UI */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:44px;font-weight:600;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad)}
.btn.primary.danger-fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.ghost{border-color:transparent;background:none}
.icon-btn{border:0;background:none;width:44px;height:44px;border-radius:10px;font-size:20px;display:grid;place-items:center;color:inherit}
.icon-btn:hover{background:var(--surface-2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.file{padding:0 4px 0 0;max-width:100%}
.chip.file .link{border:0;background:none;padding:6px 4px 6px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;color:var(--accent)}
.chip .x{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:50%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--neutral-soft);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.info{background:var(--info-soft);color:var(--info)}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty h2{color:var(--text);margin-bottom:8px;font-size:20px}
.empty .btn{margin:14px 4px 0}
.section-h{font-size:16px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-h:first-child{margin-top:0}
.pre{white-space:pre-wrap;word-break:break-word}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* Forms */
.field{display:grid;gap:5px;margin-bottom:12px}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
textarea.inp{min-height:96px;resize:vertical}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatches input:checked+span{border-color:var(--text)}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px}

/* Avatars & students */
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;object-fit:cover;background:#8892a6}
.av.lg{width:96px;height:96px;font-size:30px}
.av.xl{width:180px;height:180px;font-size:54px;max-width:100%}
.av.sm{width:32px;height:32px;font-size:12px}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.st-card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);text-align:left;box-shadow:var(--shadow);min-height:68px}
.st-card .nm{font-weight:600;line-height:1.25}
.st-card .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ln{text-transform:uppercase;letter-spacing:.01em}

/* Grade table */
.gt-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);max-height:calc(100dvh - 210px);-webkit-overflow-scrolling:touch}
table.gt{border-collapse:separate;border-spacing:0;min-width:100%}
.gt th,.gt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;background:var(--surface)}
.gt thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font-weight:600;text-align:center;vertical-align:bottom}
.gt .name{position:sticky;left:0;z-index:1;text-align:left;min-width:190px;max-width:240px;padding:6px 10px}
.gt thead .name{z-index:3}
.gt tfoot td{position:sticky;bottom:0;z-index:1;background:var(--surface-2);font-weight:600;text-align:center;padding:8px 6px}
.gt tfoot .name{z-index:2}
.gt .namebtn{border:0;background:none;padding:4px 0;text-align:left;display:flex;align-items:center;gap:8px;width:100%}
.colh{min-width:84px;max-width:140px;padding:8px 6px!important;cursor:pointer}
.colh .ct{font-size:14px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.colh .cm{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:3px}
.colh:hover{background:var(--accent-soft)}
.gt td.cell{text-align:center}
.gin{width:100%;min-width:72px;height:44px;border:0;background:transparent;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.gin:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
.g-ok{background:var(--ok-soft)!important;color:var(--ok)}
.g-warn{background:var(--warn-soft)!important;color:var(--warn)}
.g-bad{background:var(--bad-soft)!important;color:var(--bad)}
.g-abs,.g-exc,.g-ne{background:var(--neutral-soft)!important;color:var(--muted)}
.gt td.avg{text-align:center;font-weight:700;min-width:96px;padding:4px 8px;font-variant-numeric:tabular-nums}
.gt td.avg small{display:block;font-weight:500;font-size:12px;opacity:.85}
.legend{font-size:13px;color:var(--muted);margin-top:10px}
.cpc-svg{width:28px;height:28px;display:block}
.pos-ic{color:var(--ok)}.neg-ic{color:var(--bad)}
.cpc-list{display:grid;gap:8px}
.cpc-row{display:grid;grid-template-columns:minmax(170px,1fr) 72px auto;gap:10px;align-items:center;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.cpc-row .who{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 0;text-align:left;min-width:0;min-height:44px}
.cpc-row .who .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpc-note{font-size:22px;font-weight:800;text-align:center;border-radius:10px;padding:6px 0;font-variant-numeric:tabular-nums}
.cpc-note small{font-size:12px;font-weight:500;opacity:.8}
.cpc-icons{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.cpc-sep{width:1px;height:40px;background:var(--line);margin:0 4px}
.cpc-btn{position:relative;width:54px;height:58px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;display:grid;place-items:center;align-content:center;gap:1px;padding:2px}
.cpc-btn.pos{color:var(--ok)}.cpc-btn.neg{color:var(--bad)}
.cpc-btn:active{transform:scale(.94);background:var(--accent-soft)}
.cpc-btn .pts{font-size:11.5px;font-weight:800;line-height:1}
.cpc-btn .cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--text);color:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.cpc-log{display:grid;gap:4px}
.cpc-log-row{display:flex;align-items:center;gap:10px;padding:4px 6px;border-bottom:1px solid var(--line)}
.cpc-log-row .cpc-svg{width:24px;height:24px}
.seg-sm{justify-content:center}
.seg-sm button{min-width:0;height:36px;padding:0 10px;font-size:13px;font-weight:600}
.seg-sm button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (max-width:1050px){.cpc-row{grid-template-columns:1fr 72px}.cpc-icons{grid-column:1/-1;justify-content:flex-start}}
.dx-q{background:var(--accent-soft);border-radius:10px;padding:10px 12px;display:grid;gap:4px;margin-top:8px}
.dx-h{font-size:15px;margin:18px 0 8px}
.dx-box{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;margin-bottom:10px;background:var(--surface-2)}
.dx-box .inp{background:var(--surface)}
.dx-action{border-left:3px solid var(--accent);padding-left:10px;display:grid;gap:6px}
.dx-bilans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dx-bilan{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px}
.dx-bilan.current{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
@media (max-width:640px){.dx-bilans{grid-template-columns:1fr}}
.ar-tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:1px 5px;border-radius:5px;background:var(--info-soft);color:var(--info);vertical-align:2px;margin-left:4px;text-transform:none}
.ar-tag.todo{background:var(--warn-soft);color:var(--warn)}
.ar-card.ok{border-color:var(--info)}
.ar-card.todo{border-color:var(--warn)}
.ar-list{margin:0;padding-left:20px;columns:2 280px;column-gap:28px}
.ar-list li{margin:2px 0;break-inside:avoid}
.ar-banner{background:var(--info-soft);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px}
.ar-banner summary{cursor:pointer}
.ar-banner-list{display:grid;gap:6px;margin-top:8px}
.pcell{width:100%;height:44px;border:0;background:transparent;font-size:17px;font-weight:700;color:inherit;font-variant-numeric:tabular-nums}
.pcell small{font-size:11px;font-weight:500;opacity:.8}
.draw-box{display:grid;justify-items:center;gap:16px;text-align:center;padding:8px 0}
.draw-name{font-size:28px;font-weight:800;min-height:36px}
.draw-go{min-width:280px;min-height:58px;font-size:19px}
.draw-opts{display:grid;gap:0;text-align:left}
.icon-cell{font-size:24px;line-height:1;cursor:pointer;padding:0}
.icon-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.icon-pick button{display:grid;justify-items:center;gap:4px;padding:12px 6px;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;min-height:92px}
.icon-pick button span{font-size:38px;line-height:1}
.icon-pick button small{font-size:13px;color:var(--muted);font-weight:600}
.icon-pick button.on{border-color:var(--accent);background:var(--accent-soft)}
.bull td.num{white-space:nowrap}
.bull td.num b{font-size:17px}
.bull tfoot td{background:var(--surface-2)}
.bull .namebtn{display:flex;align-items:center;gap:8px;text-align:left}

/* Attendance */
.att-list{display:grid;gap:8px}
.att-row{display:grid;grid-template-columns:minmax(160px,1fr) auto;gap:8px 12px;align-items:center;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.att-row .who{display:flex;align-items:center;gap:10px;min-width:0}
.att-row .who .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:6px}
.seg button{min-width:52px;height:44px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;font-weight:700;color:var(--muted)}
.seg button.on.st-P{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.st-A{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on.st-R{background:var(--warn);border-color:var(--warn);color:#fff}
.seg button.on.st-J{background:var(--info);border-color:var(--info);color:#fff}
.att-row .note{grid-column:1/-1}
.att-date{display:flex;align-items:center;gap:6px}
.att-date .inp{width:auto}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
table.plain{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.plain th,.plain td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
.plain th{font-size:13px;color:var(--muted);background:var(--surface-2)}
.plain td.num,.plain th.num{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.plain tr:last-child td{border-bottom:0}
.tbl-scroll{overflow-x:auto}

/* Journal & DAccE */
.entries{display:grid;gap:12px}
.entry{padding:14px 16px}
.entry-h{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.entry-h .ttl{font-weight:700;font-size:17px;flex:1;min-width:180px}
.entry .when{font-size:13px;color:var(--muted)}
.entry .body{margin-top:8px}
.hw{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warn-soft)}
.hw b{color:var(--warn)}
.upcoming{padding:12px 16px;margin-bottom:16px}
.upcoming li{margin:4px 0}

/* Profile */
.profile-head{display:flex;gap:16px;align-items:center;padding:16px;margin-bottom:16px;flex-wrap:wrap}
.profile-head .nm{font-size:24px;font-weight:700}
.photo-btn{border:0;background:none;padding:0;border-radius:50%;position:relative}
.photo-btn::after{content:"📷";position:absolute;right:-2px;bottom:-2px;background:var(--surface);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;box-shadow:var(--shadow);font-size:15px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{padding:8px 14px;border-radius:10px;background:var(--surface-2);min-width:96px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--muted)}
.pad{padding:16px}

/* Modal */
.mback{position:fixed;inset:0;background:rgb(10 14 22/.45);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
.modal{background:var(--surface);color:var(--text);border-radius:16px;width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgb(0 0 0/.3)}
.modal.wide{width:min(860px,100%)}
.modal>header{display:flex;align-items:center;padding:12px 8px 8px 18px;border-bottom:1px solid var(--line)}
.modal>header h2{flex:1;font-size:18px}
.mbody{padding:16px 18px;overflow:auto}
.modal>footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap}
.modal>footer:empty{display:none}
.modal>footer .left{margin-right:auto}
.viewer img,.viewer iframe{width:100%;max-height:70dvh;object-fit:contain;border:0;border-radius:8px;background:var(--surface-2)}
.viewer iframe{height:70dvh}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1d2433;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.actionable{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast-btn{border:0;background:#ffffff26;color:#fff;border-radius:8px;padding:8px 12px;font-weight:700;min-height:40px}

/* Narrow screens (iPad portrait split view, phones) */
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #sidebar{position:fixed;inset:0 auto 0 0;width:290px;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgb(0 0 0/.3)}
  body.side-open #sidebar{transform:none}
  body.side-open::after{content:"";position:fixed;inset:0;background:rgb(0 0 0/.35);z-index:30}
  .menu-btn{display:grid}
}
@media (max-width:560px){
  .row2,.row3{grid-template-columns:1fr}
  .att-row{grid-template-columns:1fr}
  .seg button{min-width:0;flex:1}
  .grid2{grid-template-columns:1fr}
}
@media print{
  body{overflow:visible;background:#fff}
  #app{display:block;height:auto}
  #sidebar,.tabs,.toolbar,.menu-btn,.no-print{display:none!important}
  #view{overflow:visible}
  .gt-wrap{max-height:none;overflow:visible;border:0}
  .gt thead th,.gt .name,.gt tfoot td{position:static}
  .gin{font-size:13px;height:28px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Classes"></aside>
  <main>
    <header class="topbar" id="topbar"></header>
    <section id="view" tabindex="-1"></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============================================================
   Carnet du prof — application de classe hors ligne pour iPad
   Données stockées localement (IndexedDB) sur l'appareil.
   ============================================================ */

// ---------- Helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const isoOf = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const todayISO = () => isoOf(new Date());
const dateOf = iso => new Date(iso + 'T12:00:00');
const fmtDate = (iso, opts = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) => iso ? dateOf(iso).toLocaleDateString('fr-BE', opts) : '';
const fmtShort = iso => iso ? dateOf(iso).toLocaleDateString('fr-BE', { day: '2-digit', month: '2-digit' }) : '';
const fmtNum = (n, d = 1) => Number.isFinite(n) ? n.toLocaleString('fr-BE', { maximumFractionDigits: d }) : '–';
const fmtSize = b => b < 1024 ? b + ' o' : b < 1048576 ? (b / 1024).toFixed(0) + ' Ko' : (b / 1048576).toFixed(1) + ' Mo';
const collator = new Intl.Collator('fr', { sensitivity: 'base' });
const addDays = (iso, n, skipWeekend) => {
  const d = dateOf(iso);
  do { d.setDate(d.getDate() + n); } while (skipWeekend && (d.getDay() === 0 || d.getDay() === 6));
  return isoOf(d);
};

const COLORS = ['#2f6fec', '#16a34a', '#dc2626', '#d97706', '#7c3aed', '#0891b2', '#db2777', '#64748b'];
const STATUS = {
  P: { label: 'Présent', short: 'P' },
  A: { label: 'Absent', short: 'A' },
  R: { label: 'Retard', short: 'R' },
  J: { label: 'Absence justifiée', short: 'J' }
};
const DACCE_TYPES = ['Observation', 'Point fort', 'Difficulté', 'Aménagement raisonnable', 'Remédiation', 'Contact parents', 'Plan individuel (PIA)', 'Orientation', 'Autre'];
const DACCE_TAG = { 'Point fort': 'ok', 'Difficulté': 'bad', 'Aménagement raisonnable': 'info', 'Remédiation': 'warn', 'Contact parents': 'accent', 'Plan individuel (PIA)': 'info' };

// ---------- Storage (IndexedDB, fallback mémoire) ----------
const DB = {
  db: null, ok: false, mem: { kv: new Map(), files: new Map() },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('carnet-prof', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('files'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      this.ok = true;
    } catch (e) { console.warn('IndexedDB indisponible', e); this.ok = false; }
  },
  _req(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r ? r.result : undefined);
      t.onerror = t.onabort = () => rej(t.error);
    });
  },
  get(store, k) { return this.ok ? this._req(store, 'readonly', s => s.get(k)) : Promise.resolve(this.mem[store].get(k)); },
  put(store, k, v) { if (!this.ok) { this.mem[store].set(k, v); return Promise.resolve(); } return this._req(store, 'readwrite', s => s.put(v, k)); },
  del(store, k) { if (!this.ok) { this.mem[store].delete(k); return Promise.resolve(); } return this._req(store, 'readwrite', s => s.delete(k)); },
  keys(store) { return this.ok ? this._req(store, 'readonly', s => s.getAllKeys()) : Promise.resolve([...this.mem[store].keys()]); },
  clear(store) { if (!this.ok) { this.mem[store].clear(); return Promise.resolve(); } return this._req(store, 'readwrite', s => s.clear()); }
};

// ---------- State ----------
let S;
const defaultState = () => ({
  version: 1,
  settings: { teacher: '', school: '', year: '', scale: 20, pass: 50, absZero: false, skipWeekend: true, theme: 'auto', lastBackup: null,
    bulletinScale: 20, drawNoRepeat: true, drawSkipAbsent: true, daccePeriods: defaultDaccePeriods(), periods: defaultPeriods(), icons: defaultIcons(), cpc: defaultCpc() },
  classes: [],
  ui: { view: 'class', classId: null, tab: 'eleves', studentId: null, attDate: null, gradeCat: '', gradePeriod: '', partPeriod: '', dacceStudent: '', dacceType: '' }
});
// Trois périodes de bulletin par défaut, calées sur l'année scolaire en cours
function defaultPeriods() {
  const now = new Date(), y = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear() - 1;
  return [
    { name: 'Période 1', end: `${y}-12-23`, weight: 1 },
    { name: 'Période 2', end: `${y + 1}-03-31`, weight: 1 },
    { name: 'Période 3', end: `${y + 1}-07-03`, weight: 1 }
  ];
}
// Cote de participation à points (fiche « Comment je suis coté(e) ») :
// chaque élève démarre la période à 14/20, les icônes ajoutent ou retirent des points.
const CPC_SVG = {
  bulb: '<path d="M9 18h6M10 21h4M12 5a5.5 5.5 0 0 0-3.3 9.9c.5.4.8 1 .8 1.6V16h5v-.5c0-.6.3-1.2.8-1.6A5.5 5.5 0 0 0 12 5z"/><path d="M12 1.5v1.5M4.2 4.7l1.1 1.1M19.8 4.7l-1.1 1.1M2 11h1.5M20.5 11H22"/>',
  speech: '<path d="M4 4h16v11H10l-5 4v-4H4z"/><path d="M8 8.5h8M8 11.5h6"/>',
  ear: '<path d="M7.5 9.5a5 5 0 1 1 9.6 2c-.7 1.5-2 2.3-2.7 3.5-.8 1.4-.6 3.5-2.4 4.6A3 3 0 0 1 7.5 18"/><path d="M10.5 10a2.2 2.2 0 0 1 4-1.2"/>',
  rings: '<circle cx="8.8" cy="12" r="5.2"/><circle cx="15.2" cy="12" r="5.2"/>',
  pencil: '<path d="M4 20l1.2-4.8L16 4.4 19.6 8 8.8 18.8z"/><path d="M13.8 6.6l3.6 3.6"/>',
  book: '<rect x="5.5" y="3" width="13" height="18" rx="1"/><path d="M9 3v18M12.5 7.5h3"/>',
  nospeak: '<path d="M4 5h16v10h-9l-5 4v-4H4z"/><path d="M3 21L21 3"/>',
  stop: '<path d="M8.5 3h7L21 8.5v7L15.5 21h-7L3 15.5v-7z"/><path d="M8 12h8"/>',
  import: '<path d="M12 3v11M7.5 9.5L12 14l4.5-4.5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>'
};
const cpcIcon = key => `<svg class="cpc-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${CPC_SVG[key] || ''}</svg>`;
function defaultCpc() {
  return {
    base: 14, max: 20,
    items: [
      { key: 'bulb', pts: 2, short: 'Fait avancer', label: 'Je pose une question ou je fais une remarque qui fait avancer toute la classe.', self: 'Je pose des questions qui font avancer la classe.' },
      { key: 'speech', pts: 1, short: 'Avis expliqué', label: 'Je donne mon avis en l’expliquant, ou je trouve un bon exemple.', self: 'Je donne mon avis en l’expliquant.' },
      { key: 'ear', pts: 1, short: 'Écoute', label: 'J’écoute vraiment : je redis ce qu’un camarade a dit, je rebondis sur son idée, ou je change d’avis en expliquant pourquoi.', self: 'J’écoute et je rebondis sur les idées des autres.' },
      { key: 'rings', pts: 1, short: 'Coopère', label: 'J’aide un camarade, je joue mon rôle dans le groupe, je fais avancer le travail commun.', self: 'Je coopère dans le groupe.' },
      { key: 'pencil', pts: 1, short: 'Travail soigné', label: 'Mon travail écrit est soigné et rendu à temps, mon carnet est tenu.', self: 'Mon travail est en ordre et soigné.' },
      { key: 'book', pts: -1, short: 'Pas en ordre', label: 'Je ne suis pas en ordre : matériel oublié, travail non fait.' },
      { key: 'nospeak', pts: -1, short: 'Dérange', label: 'J’empêche les autres de travailler : je coupe la parole, je bavarde, je monopolise.' },
      { key: 'stop', pts: -2, short: 'Manque de respect', label: 'Je manque de respect à un camarade ou au professeur.' }
    ]
  };
}
// Échelle d'icônes pour les colonnes « icônes » du carnet de cotes (chaque icône vaut un pourcentage)
function defaultIcons() {
  return [
    { icon: '🌟', label: 'Excellent', pct: 100 },
    { icon: '😀', label: 'Très bien', pct: 80 },
    { icon: '🙂', label: 'Bien', pct: 65 },
    { icon: '😐', label: 'Moyen', pct: 50 },
    { icon: '🙁', label: 'Insuffisant', pct: 25 }
  ];
}
function normalize(st) {
  const d = defaultState();
  st = st && typeof st === 'object' ? st : d;
  st.settings = { ...d.settings, ...(st.settings || {}) };
  if (!Array.isArray(st.settings.periods) || !st.settings.periods.length) st.settings.periods = defaultPeriods();
  if (!Array.isArray(st.settings.icons) || !st.settings.icons.length) st.settings.icons = defaultIcons();
  if (!st.settings.cpc?.items?.length) st.settings.cpc = defaultCpc();
  const dp = st.settings.daccePeriods;
  // remplace les anciennes dates par défaut (reprises du Journal CPC) par celles du guide officiel
  if (!Array.isArray(dp) || dp.length !== 3 || (/-11-07$/.test(dp[0].au) && /-03-06$/.test(dp[1].au) && /-06-30$/.test(dp[2].au))) st.settings.daccePeriods = defaultDaccePeriods();
  st.ui = { ...d.ui, ...(st.ui || {}) };
  st.classes = Array.isArray(st.classes) ? st.classes : [];
  for (const c of st.classes) {
    c.students ||= []; c.columns ||= []; c.grades ||= {}; c.attendance ||= {}; c.journal ||= []; c.dossier ||= [];
    c.color ||= COLORS[0];
    c.cpc = { enabled: false, points: 20, events: [], self: {}, ...(c.cpc || {}) };
    c.drawn ||= [];
    for (const s of c.students) s.files ||= [];
  }
  return st;
}
let saveTimer = null;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 250); }
function flush() {
  clearTimeout(saveTimer); saveTimer = null;
  return DB.put('kv', 'state', JSON.parse(JSON.stringify(S))).catch(e => toast('Erreur d’enregistrement : ' + e.message));
}
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) flush(); });
window.addEventListener('pagehide', () => { if (saveTimer) flush(); });

const cls = () => S.classes.find(c => c.id === S.ui.classId);
const sortStudents = list => [...list].sort((a, b) => collator.compare(a.lastName, b.lastName) || collator.compare(a.firstName, b.firstName));
const studentName = s => s ? `${s.lastName} ${s.firstName}`.trim() : '(élève supprimé)';
const initials = s => ((s.firstName || '')[0] || '') + ((s.lastName || '')[0] || '');
function avatar(s, size = '') {
  if (s.photo) return `<img class="av ${size}" src="${s.photo}" alt="">`;
  const hue = [...(s.lastName + s.firstName)].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 360, 7);
  return `<span class="av ${size}" style="background:hsl(${hue} 45% 48%)" aria-hidden="true">${esc(initials(s).toUpperCase())}</span>`;
}
// Aménagements raisonnables (AR) : s.ar = { motif, liste: [], source, note }
const hasAR = s => !!(s.ar && ((s.ar.liste || []).length || s.ar.note || s.ar.motif));
const arTag = s => !hasAR(s) ? '' : (s.ar.liste || []).length
  ? ` <span class="ar-tag" title="${esc(s.ar.liste.join(' · '))}">AR</span>`
  : ` <span class="ar-tag todo" title="${esc(s.ar.note || 'Aménagements à compléter')}">AR ?</span>`;
const nameHTML = s => `<span><span class="ln">${esc(s.lastName)}</span> ${esc(s.firstName)}${arTag(s)}</span>`;
function arCard(s) {
  const ar = s.ar || {}, n = (ar.liste || []).length;
  return `<div class="card pad ar-card ${n ? 'ok' : hasAR(s) ? 'todo' : ''}" style="margin-bottom:16px">
    <div class="toolbar" style="margin-bottom:8px"><h3 class="section-h" style="margin:0">Aménagements raisonnables</h3>${ar.source ? `<span class="muted small">${esc(ar.source)}</span>` : ''}<span class="spacer"></span>
      ${n ? `<button class="btn sm" data-act="ar-to-dacce">＋ Note DAccE depuis ses AR</button>` : ''}</div>
    ${ar.note ? `<div class="hw" style="margin:0 0 10px"><b>À faire :</b> ${esc(ar.note)} <button class="btn sm ghost" data-act="ar-note-done">C’est fait</button></div>` : ''}
    ${n ? `<ul class="ar-list">${ar.liste.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    <details ${n ? '' : 'open'}><summary class="small" style="cursor:pointer;font-weight:600;color:var(--accent);margin:6px 0">${n ? 'Modifier' : 'Encoder les aménagements'}</summary>
      <label class="field"><span>Motif communiqué (confidentiel)</span><input class="inp" data-arfield="motif" value="${esc(ar.motif || '')}" placeholder="Ex. dyslexie, TDAH…"></label>
      <label class="field"><span>Aménagements (un par ligne)</span><textarea class="inp" data-arfield="liste" rows="${Math.max(4, n + 1)}" placeholder="Recopiez ici la liste reçue de l’école">${esc((ar.liste || []).join('\n'))}</textarea></label>
      <label class="field"><span>Source</span><input class="inp" data-arfield="source" value="${esc(ar.source || '')}" placeholder="Ex. mail de la direction du 08/09"></label>
    </details></div>`;
}
// Rappel des AR de la classe (carnet de cotes, présences, participation)
function arBanner(c) {
  const list = sortStudents(c.students).filter(hasAR);
  if (!list.length) return '';
  return `<details class="ar-banner no-print"><summary><span class="ar-tag">AR</span> <b>${list.length} élève${list.length > 1 ? 's' : ''} avec aménagements raisonnables</b> <span class="muted small">— toucher pour voir</span></summary>
    <div class="ar-banner-list">${list.map(s => `<div><button class="namebtn" style="border:0;background:none;padding:0;display:inline-flex;font-weight:700" data-act="open-student" data-id="${s.id}">${esc(studentName(s))}</button>${(s.ar.liste || []).length ? ` : <span class="small">${s.ar.liste.map(esc).join(' · ')}</span>` : ` : <span class="small muted">${esc(s.ar.note || 'liste à compléter')}</span>`}</div>`).join('')}</div></details>`;
}

// ---------- Grades ----------
const sortedCols = c => [...c.columns].sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.created || 0) - (b.created || 0));
// Période d'une évaluation : choisie à la main, sinon déduite de la date
function periodOfDate(date) {
  const P = S.settings.periods, i = P.findIndex(p => p.end && (date || '') <= p.end);
  return i < 0 ? P.length - 1 : i;
}
function colPeriod(col) {
  const P = S.settings.periods;
  if (Number.isInteger(col.period) && col.period >= 0 && col.period < P.length) return col.period;
  return periodOfDate(col.date);
}
const periodStart = i => i > 0 && S.settings.periods[i - 1].end ? addDays(S.settings.periods[i - 1].end, 1) : '';
const periodStarted = i => !periodStart(i) || todayISO() >= periodStart(i);
// ---- Participation à points ----
const cpcItem = key => S.settings.cpc.items.find(it => it.key === key);
const evPts = e => Number.isFinite(e.pts) ? e.pts : (Number(cpcItem(e.k)?.pts) || 0);
const evShort = e => e.k === 'import' ? 'Importé d’iDoceo' : (cpcItem(e.k)?.short || '?');
const cpcEvents = (c, sid, i) => c.cpc.events.filter(e => e.sid === sid && periodOfDate(e.date) === i);
function cpcNote(c, sid, i) {
  const { base, max } = S.settings.cpc;
  const sum = cpcEvents(c, sid, i).reduce((t, e) => t + evPts(e), 0);
  return Math.max(0, Math.min(Number(max) || 20, (Number(base) || 0) + sum));
}
const cpcOn = c => !!c?.cpc?.enabled;
// Note de période : participation (si activée) + évaluations de la période, selon la part choisie
// Points d'une période : évaluations de la période + participation (comptée comme une évaluation)
function periodPoints(c, sid, i) {
  const r = pointsOf(c, sid, periodCols(c, i));
  if (cpcOn(c) && periodStarted(i)) {
    const pts = Number(c.cpc.points) || 20;
    r.got += cpcNote(c, sid, i) / (Number(S.settings.cpc.max) || 20) * pts; r.max += pts;
  }
  return r;
}
function periodAvg(c, sid, i) {
  const r = periodPoints(c, sid, i);
  return r.max ? r.got / r.max * 100 : NaN;
}
const fmtPtsTotal = r => `${fmtNum(r.got, 1)} / ${fmtNum(r.max, 1)} pts`;
// Période affichée dans le carnet de cotes : '' = période en cours, 'all' = toute l'année
const selPeriod = () => S.ui.gradePeriod === 'all' ? null : S.ui.gradePeriod === '' ? periodOfDate(todayISO()) : +S.ui.gradePeriod;
const visibleCols = c => { const sp = selPeriod(); return sortedCols(c).filter(col => (!S.ui.gradeCat || col.category === S.ui.gradeCat) && (sp == null || colPeriod(col) === sp)); };
const gradeMode = () => S.ui.gradeCat ? 'filter' : selPeriod() == null ? 'year' : 'period';
function rowAvg(c, sid) {
  const m = gradeMode();
  return m === 'filter' ? studentAvg(c, sid, visibleCols(c)) : m === 'year' ? annualAvg(c, sid) : periodAvg(c, sid, selPeriod());
}
function avgCellHTML(c, sid) {
  const avg = rowAvg(c, sid), bs = S.settings.bulletinScale, m = gradeMode();
  const r = m === 'period' ? periodPoints(c, sid, selPeriod()) : m === 'filter' ? pointsOf(c, sid, visibleCols(c)) : null;
  return Number.isFinite(avg) ? `${fmtOn(avg, bs)}<span style="font-weight:500;font-size:13px">/${bs}</span>${r ? `<small>${fmtPtsTotal(r)}</small>` : ''}` : '–';
}
const periodCols = (c, i) => sortedCols(c).filter(col => colPeriod(col) === i);
const isIcon = v => typeof v === 'string' && /^I\d+$/.test(v);
const iconOf = v => isIcon(v) ? S.settings.icons[+v.slice(1)] : null;
// Valeur d'une cote en pourcentage (NaN si non chiffrée)
function valuePct(v, col) {
  if (typeof v === 'number') return col.max ? v / col.max * 100 : NaN;
  const ic = iconOf(v);
  return ic ? Number(ic.pct) : NaN;
}
// Total des points : points obtenus / points possibles (une pondération multiplie les points de la colonne)
const colPoints = col => col.type === 'icons' ? 20 : Number(col.max) || 0;
function pointsOf(c, sid, cols) {
  let got = 0, max = 0;
  for (const col of cols) {
    const v = c.grades[col.id]?.[sid], w = Number(col.weight) || 0, m = colPoints(col) * w;
    if (!m) continue;
    const p = valuePct(v, col);
    if (Number.isFinite(p)) { got += p / 100 * m; max += m; }
    else if (v === 'ABS' && S.settings.absZero) max += m;
  }
  return { got, max };
}
function studentAvg(c, sid, cols = visibleCols(c)) {
  const r = pointsOf(c, sid, cols);
  return r.max ? r.got / r.max * 100 : NaN;
}
// Moyenne annuelle : moyenne pondérée des périodes qui ont des cotes
function annualAvg(c, sid) {
  let num = 0, den = 0;
  S.settings.periods.forEach((p, i) => {
    const a = periodAvg(c, sid, i), w = Number(p.weight) || 0;
    if (Number.isFinite(a) && w) { num += a * w; den += w; }
  });
  return den ? num / den : NaN;
}
function colAvg(c, col) {
  const vals = Object.values(c.grades[col.id] || {}).map(v => valuePct(v, col)).filter(Number.isFinite);
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : NaN;
}
function pctClass(p) {
  if (!Number.isFinite(p)) return '';
  const pass = Number(S.settings.pass) || 50;
  return p < pass ? 'g-bad' : p < pass + 10 ? 'g-warn' : 'g-ok';
}
function gradeClass(v, col) {
  if (v == null) return '';
  if (typeof v === 'number' || isIcon(v)) return pctClass(valuePct(v, col));
  return { ABS: 'g-abs', EXC: 'g-exc', NE: 'g-ne' }[v] || '';
}
const fmtGrade = v => v == null ? '' : typeof v === 'number' ? String(v).replace('.', ',') : isIcon(v) ? (iconOf(v)?.icon || '?') : ({ ABS: 'abs', EXC: 'exc', NE: 'ne' }[v] || v);
const fmtOn = (p, scale) => Number.isFinite(p) ? fmtNum(p / 100 * scale) : '–';
const fmtScaled = p => Number.isFinite(p) ? `${fmtNum(p / 100 * S.settings.scale)}/${S.settings.scale}` : '';
function parseGrade(raw, max) {
  const t = String(raw).trim().toLowerCase().replace(/,/g, '.');
  if (!t) return { v: null };
  if (['abs', 'a', 'absent'].includes(t)) return { v: 'ABS' };
  if (['exc', 'ex', 'e', 'excusé', 'excuse', 'm'].includes(t)) return { v: 'EXC' };
  if (['ne', 'n', '-', 'nr'].includes(t)) return { v: 'NE' };
  let n;
  const m = t.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
  if (m) n = Number(m[1]) / Number(m[2]) * max;
  else if (/^\d+(\.\d+)?%$/.test(t)) n = parseFloat(t) / 100 * max;
  else n = Number(t);
  if (!Number.isFinite(n) || n < 0) return { err: true };
  return { v: Math.round(n * 100) / 100 };
}

// ---------- Attendance ----------
function attStats(c, sid) {
  const r = { days: 0, P: 0, A: 0, R: 0, J: 0 };
  for (const d in c.attendance) {
    const e = c.attendance[d][sid];
    if (!e) continue;
    r.days++; r[e.s] = (r[e.s] || 0) + 1;
  }
  return r;
}

// ---------- Files ----------
function pickFiles({ accept = '', multiple = true, capture } = {}) {
  return new Promise(res => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = accept; i.multiple = multiple; i.hidden = true;
    if (capture) i.setAttribute('capture', capture);
    document.body.append(i);
    i.addEventListener('change', () => { res([...i.files]); i.remove(); });
    i.addEventListener('cancel', () => { res([]); i.remove(); });
    i.click();
  });
}
async function storeFiles(files) {
  const out = [];
  for (const f of files) {
    const id = uid();
    const blob = new Blob([await f.arrayBuffer()], { type: f.type || 'application/octet-stream' });
    await DB.put('files', id, { blob, name: f.name, type: blob.type, size: blob.size });
    out.push({ id, name: f.name || 'fichier', type: blob.type, size: blob.size, date: todayISO() });
  }
  return out;
}
const fileIcon = f => f.type?.startsWith('image/') ? '🖼️' : f.type === 'application/pdf' ? '📄' : f.type?.startsWith('audio/') ? '🎵' : f.type?.startsWith('video/') ? '🎬' : '📎';
const fileChips = list => list?.length ? `<div class="files">${list.map(f => `<span class="chip file"><button type="button" class="link" data-act="open-file" data-id="${f.id}">${fileIcon(f)} ${esc(f.name)}</button></span>`).join('')}</div>` : '';
async function deleteFiles(list) { for (const f of list || []) await DB.del('files', f.id); }
async function openFile(id) {
  const rec = await DB.get('files', id);
  if (!rec) return toast('Fichier introuvable');
  const url = URL.createObjectURL(rec.blob);
  const isImg = rec.type.startsWith('image/'), isPdf = rec.type === 'application/pdf';
  const preview = isImg ? `<img src="${url}" alt="">` : isPdf ? `<iframe src="${url}" title="${esc(rec.name)}"></iframe>`
    : `<div class="empty">${fileIcon(rec)}<br>${esc(rec.name)}<br><span class="small">${fmtSize(rec.size)}</span></div>`;
  modal({
    title: rec.name, wide: true, body: `<div class="viewer">${preview}</div>`,
    actions: [
      { label: 'Partager / Enregistrer', cls: 'primary', onClick: () => { saveBlob(rec.blob, rec.name); return false; } },
      { label: 'Ouvrir', onClick: () => { window.open(url, '_blank'); return false; } },
      { label: 'Fermer' }
    ],
    onClose: () => setTimeout(() => URL.revokeObjectURL(url), 60000)
  });
}
async function saveBlob(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return true;
}
function resizeImage(file, size = 400) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), cv = document.createElement('canvas');
      cv.width = cv.height = size;
      cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image illisible')); };
    img.src = url;
  });
}
// Photo d'élève : appareil photo de l'iPad ou photothèque, recadrée en carré
async function takePhoto(fromLibrary = false) {
  const [f] = await pickFiles(fromLibrary ? { accept: 'image/*', multiple: false } : { accept: 'image/*', capture: 'environment', multiple: false });

}

function photoSession(onlyMissing) {

// Éditeur de pièces jointes utilisé dans les fenêtres (journal, DAccE)
function attachEditor(box, list) {
  const added = [], removed = [];
  const draw = () => {
    box.innerHTML = `<div class="files">${list.map(f => `<span class="chip file"><button type="button" class="link" data-act="open-file" data-id="${f.id}">${fileIcon(f)} ${esc(f.name)}</button><button type="button" class="x" data-rm="${f.id}" aria-label="Retirer ${esc(f.name)}">✕</button></span>`).join('')}
      <button type="button" class="btn sm" data-add>📎 Joindre un fichier</button>
      <button type="button" class="btn sm" data-cam>📷 Photo</button></div>`;
  };
  box.addEventListener('click', async e => {
    const rm = e.target.closest('[data-rm]');
    if (rm) { const i = list.findIndex(f => f.id === rm.dataset.rm); if (i >= 0) removed.push(...list.splice(i, 1)); draw(); return; }
    let files = null;
    if (e.target.closest('[data-add]')) files = await pickFiles();
    if (e.target.closest('[data-cam]')) files = await pickFiles({ accept: 'image/*', capture: 'environment', multiple: false });
    if (files?.length) { const m = await storeFiles(files); list.push(...m); added.push(...m); draw(); }
  });
  draw();
  return { list, commit: () => deleteFiles(removed), rollback: () => deleteFiles(added) };
}

// ---------- Modal, confirm, toast ----------
function modal({ title, body, actions = [], wide = false, onClose, onOpen }) {
  const wrap = document.createElement('div');
  wrap.className = 'mback';
  wrap.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Fermer">✕</button></header>
    <div class="mbody">${body}</div><footer></footer></div>`;
  let closed = false;
  const close = v => { if (closed) return; closed = true; wrap.remove(); onClose?.(v); };
  const foot = wrap.querySelector('footer');
  for (const a of actions) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn ' + (a.cls || ''); b.textContent = a.label;
    b.addEventListener('click', async () => {
      b.disabled = true;
      try { const r = a.onClick ? await a.onClick(wrap) : undefined; if (r !== false) close(a.value); }
      finally { b.disabled = false; }
    });
    foot.append(b);
  }
  wrap.addEventListener('click', e => { if (e.target === wrap || e.target.closest('[data-close]')) close(); });
  wrap._close = close;
  $('#modal-root').append(wrap);
  onOpen?.(wrap);
  return { el: wrap, close };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal-root').lastElementChild?._close(); });
function confirmDlg(msg, okLabel = 'Supprimer', danger = true) {
  return new Promise(res => modal({
    title: 'Confirmation', body: `<p class="pre">${esc(msg)}</p>`,
    actions: [{ label: 'Annuler', value: false }, { label: okLabel, cls: danger ? 'primary danger-fill' : 'primary', value: true }],
    onClose: v => res(!!v)
  }));
}
let toastTimer;
function toast(msg, action) {
  const t = $('#toast'); t.textContent = msg;
  if (action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'toast-btn'; b.textContent = action.label;
    b.onclick = () => { t.classList.remove('show'); action.fn(); };
    t.append(b);
  }
  t.classList.toggle('actionable', !!action); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show', 'actionable'), action ? 5000 : 2800);
}

const normName = x => String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
async function importAR() {
  const [f] = await pickFiles({ accept: '.json,application/json', multiple: false });
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch { return toast('Fichier illisible'); }
  if (data?.app !== 'journal-cpc-ar' || !Array.isArray(data.eleves)) return toast('Ce fichier ne contient pas d’aménagements raisonnables du Journal CPC');
  const plan = [], missing = [], noClass = new Set();
  for (const x of data.eleves) {
    const c = S.classes.find(k => normName(k.name) === normName(x.classe));
    if (!c) { noClass.add(x.classe); continue; }
    const full = normName(`${x.nom} ${x.prenom}`);

    if (!s) { const same = c.students.filter(k => normName(k.lastName) === normName(x.nom)); if (same.length === 1) s = same[0]; }

      ${missing.length ? `<p class="small" style="color:var(--warn)">Élèves introuvables (nom différent ?) : ${missing.map(esc).join(' ; ')}</p>` : ''}
      <p class="small muted">Ce qui est déjà encodé dans le Carnet est remplacé seulement si le Journal contient une liste.</p>`,
    actions: [{ label: 'Annuler' }, { label: 'Importer', cls: 'primary', onClick: () => {

// ---------- Tirage au sort ----------
function drawStudent() {
  const c = cls(); if (!c?.students.length) return;
  const today = todayISO(), st = S.settings;
  const absent = sid => ['A', 'J'].includes(c.attendance[today]?.[sid]?.s);
  let picked = null, rolling = false;
  const eligible = () => c.students.filter(s => !(st.drawSkipAbsent && absent(s.id)));
  const draw = el => {
    const el2 = $('.mbody', el), elig = eligible(), done = elig.filter(s => c.drawn.includes(s.id)).length;
    el2.innerHTML = `<div class="draw-box">
      <div class="draw-face">${picked ? avatar(picked, 'xl') : '<span class="av xl" style="background:var(--neutral-soft);color:var(--muted)">?</span>'}</div>
      <div class="draw-name">${picked ? nameHTML(picked) : 'Touchez « Tirer au sort »'}</div>
      ${picked && cpcOn(c) && !rolling ? `<div class="cpc-icons" style="justify-content:center">${S.settings.cpc.items.map(it => `<button class="cpc-btn ${it.pts < 0 ? 'neg' : 'pos'}" data-act="cpc-add" data-sid="${picked.id}" data-k="${it.key}" title="${esc(it.short)}">${cpcIcon(it.key)}<span class="pts">${fmtPts(it.pts)}</span></button>`).join('')}</div>` : ''}
      <button type="button" class="btn primary draw-go" data-draw ${rolling ? 'disabled' : ''}>🎲 ${picked ? 'Un autre élève' : 'Tirer au sort'}</button>
      <div class="draw-opts">
        <label class="check"><input type="checkbox" data-opt="drawNoRepeat" ${st.drawNoRepeat ? 'checked' : ''}> Chacun son tour (pas deux fois le même avant que tout le monde soit passé)</label>
        <label class="check"><input type="checkbox" data-opt="drawSkipAbsent" ${st.drawSkipAbsent ? 'checked' : ''}> Ignorer les élèves notés absents aujourd’hui</label>
      </div>
      ${st.drawNoRepeat ? `<div class="small muted">Déjà passés : ${done} / ${elig.length} <button type="button" class="btn sm ghost" data-reset>Recommencer le tour</button></div>` : ''}
    </div>`;
  };
  const roll = el => {
    let pool = eligible();
    if (!pool.length) return toast('Aucun élève disponible');
    if (st.drawNoRepeat) {
      let left = pool.filter(s => !c.drawn.includes(s.id));
      if (!left.length) { c.drawn = c.drawn.filter(id => !pool.some(s => s.id === id)); left = pool; toast('Tout le monde est passé : nouveau tour'); }
      pool = left;
    }
    const final = pool[Math.floor(Math.random() * pool.length)];
    const show = s => { $('.draw-face', el).innerHTML = avatar(s, 'xl'); $('.draw-name', el).innerHTML = nameHTML(s); };
    const finish = () => { rolling = false; picked = final; if (!c.drawn.includes(final.id)) c.drawn.push(final.id); save(); draw(el); };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || pool.length === 1) return finish();
    rolling = true; draw(el);
    const all = eligible(); let k = 0;
    const step = () => {
      if (!el.isConnected) return;
      if (k++ >= 14) return finish();
      show(all[Math.floor(Math.random() * all.length)]);
      setTimeout(step, 40 + k * k * 0.9);
    };
    step();
  };
  modal({
    title: 'Élève au hasard', wide: true,
    onOpen: el => {
      draw(el);
      el.addEventListener('click', e => {
        if (e.target.closest('[data-draw]')) roll(el);
        if (e.target.closest('[data-reset]')) { c.drawn = []; save(); draw(el); }
      });
      el.addEventListener('change', e => { const o = e.target.dataset.opt; if (o) { st[o] = e.target.checked; save(); draw(el); } });
      roll(el);
    }
  });
}

function viewDacce(c) {
  const studs = sortStudents(c.students);

  const suivis = studs.filter(s => s.dacc?.suivi);
  const st = s => (dget(s).bilans[P.k] || {}).statut || '';
  const prets = suivis.filter(s => verifDacc(s).pret).length, encodes = suivis.filter(s => st(s) === 'encode').length;
  const lab = { memo: '<span class="tag warn">Mémo prêt</span>', transmis: '<span class="tag accent">Transmis</span>', encode: '<span class="tag ok">Encodé</span>' };
  const cand = studs.filter(s => !s.dacc?.suivi && c.dossier.filter(n => n.sid === s.id).length >= 2);
  const arNo = studs.filter(s => hasAR(s) && !s.dacc?.suivi);
  const synth = `<div class="hw" style="background:${ouvert && j <= 14 ? 'var(--bad-soft)' : 'var(--accent-soft)'};margin:0 0 12px"><b style="color:${ouvert && j <= 14 ? 'var(--bad)' : 'var(--accent)'}">${esc(P.bs)} · ${esc(P.l)}</b> — ${ouvert ? `période d’encodage ouverte jusqu’au ${fmtDate(P.au, { weekday: 'long', day: 'numeric', month: 'long' })} (<b>J-${j}</b>)` : `ouverture le ${fmtDate(P.du, { weekday: 'long', day: 'numeric', month: 'long' })}`}. À minuit le dernier jour, le bilan est validé automatiquement et devient visible par les parents.</div>
    <details class="card pad" style="margin-bottom:12px"><summary style="cursor:pointer;font-weight:700">Rappel : comment fonctionne le DAccE</summary>
      <ul style="margin:.6em 0 0;padding-left:1.2em;display:grid;gap:4px;max-width:75ch">
        <li>Le bilan ne concerne que les élèves aux <b>difficultés persistantes</b> : celles qui perdurent malgré la différenciation habituelle et demandent un dispositif « spécifique et complémentaire ». Une difficulté passagère, ou un AR qui suffit, ne demande pas de bilan.</li>
        <li>Trois échéances au plus par an : <b>vendredi après le congé d’automne</b>, <b>vendredi après le congé de détente</b>, <b>dernier mardi de l’année</b>. À minuit, le bilan est finalisé, ne peut plus être modifié et devient visible par les parents.</li>
        <li>Minimum obligatoire : <b>une difficulté</b> (axe + sous-axe + suivi) et, pour chacune, <b>au moins une action de soutien</b> (catégorie + type + état). Points d’appui et commentaire sont facultatifs.</li>
        <li>Les listes suffisent : le DAccE ne demande <b>ni de justifier</b> comment la difficulté a été observée, <b>ni de détailler</b> la mise en œuvre des actions. Il en mentionne l’existence et en évalue l’efficacité.</li>
        <li>Le bilan est <b>collégial</b> ; il est encodé par un membre de l’équipe pédagogique. Votre contribution passe par la concertation et par un <b>mémo</b> (point de vue personnel, non visible par les parents, supprimé à l’échéance suivante).</li>
        <li>Au bilan suivant, chaque action déjà encodée doit être <b>évaluée</b> (poursuivie, ajustée, clôturée) : elle ne peut plus être supprimée. Quand le soutien a porté ses fruits, on encode la clôture.</li>

function parseNameLine(line) {
  line = line.trim().replace(/^\d+[.)\-\s]+/, '');
  if (!line) return null;
  const sep = line.match(/[;\t,]/);
  if (sep) { const [a, ...b] = line.split(sep[0]); return { lastName: a.trim(), firstName: b.join(' ').trim() }; }
  const w = line.split(/\s+/);
  if (w.length === 1) return { lastName: w[0], firstName: '' };
  const caps = w.filter(x => x.length > 1 && x === x.toLocaleUpperCase('fr') && /\p{L}/u.test(x));
  if (caps.length && caps.length < w.length) return { lastName: caps.join(' '), firstName: w.filter(x => !caps.includes(x)).join(' ') };
  return { lastName: w.slice(0, -1).join(' '), firstName: w[w.length - 1] };
}

async function readStudentFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.xls')) throw new Error('Ancien format .xls : dans Excel ou Numbers, enregistrez le fichier en .xlsx ou .csv');
  if (name.endsWith('.numbers')) throw new Error('Fichier Numbers : exportez-le d’abord en Excel (.xlsx) ou CSV');
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf, 0, 2);
  const rows = u8[0] === 0x50 && u8[1] === 0x4b ? await readXlsx(buf) : parseCSV(new TextDecoder().decode(buf).replace(/^\ufeff/, ''));
  return rowsToStudents(rows);
}

async function exportBackup() {
  toast('Préparation de la sauvegarde…');
  await flush();
  const files = [];
  for (const k of await DB.keys('files')) {
    const r = await DB.get('files', k);
    if (r) files.push({ id: k, name: r.name, type: r.type, data: await blobToB64(r.blob) });
  }
  const data = { app: 'carnet-prof', format: 1, exportedAt: new Date().toISOString(), state: S, files };
  const ok = await saveBlob(new Blob([JSON.stringify(data)], { type: 'application/json' }), `carnet-sauvegarde-${todayISO()}.json`);
  if (ok) { S.settings.lastBackup = new Date().toISOString(); save(); render(); }
}
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
const b64ToBlob = (b64, type) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type }); };
async function importBackup() {
  const [f] = await pickFiles({ accept: '.json,application/json', multiple: false });
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch { return toast('Fichier illisible'); }
  if (data?.app !== 'carnet-prof' || !data.state) return toast('Ce fichier n’est pas une sauvegarde du Carnet');
  if (!await confirmDlg(`Restaurer la sauvegarde du ${new Date(data.exportedAt).toLocaleString('fr-BE')} ?\nToutes les données actuelles de cet iPad seront remplacées.`, 'Restaurer')) return;
  await DB.clear('files');
  for (const x of data.files || []) await DB.put('files', x.id, { blob: b64ToBlob(x.data, x.type), name: x.name, type: x.type, size: Math.floor(x.data.length * 3 / 4) });
  S = normalize(data.state); S.ui.view = 'class';
  await flush(); render(); toast('Sauvegarde restaurée');
}

// ---------- Démo ----------
function demoClass() {
  const names = [['DUBOIS', 'Emma'], ['PEETERS', 'Lucas'], ['MAES', 'Louise'], ['JACOBS', 'Noah'], ['MERTENS', 'Olivia'], ['WILLEMS', 'Arthur'], ['CLAES', 'Mila'], ['GOOSSENS', 'Louis'], ['LAMBERT', 'Alice'], ['DUPONT', 'Jules'], ['LEROY', 'Juliette'], ['MARTIN', 'Adam']];
  const c = normalize({ classes: [{ id: uid(), name: '3e A (exemple)', subject: 'Français', color: COLORS[S.classes.length % COLORS.length] }] }).classes[0];
  c.students = names.map(([l, f]) => ({ id: uid(), lastName: l, firstName: f, files: [] }));
  const t = todayISO();
  const cols = [['Dictée 1', -20, 20, 1, 'Écrire'], ['Lecture : compréhension', -14, 10, 1, 'Lire'], ['Interro conjugaison', -7, 20, 1, 'Langue'], ['Expression orale', -3, 10, 2, 'Parler']];
  for (const [title, off, max, weight, category] of cols) {
    const col = { id: uid(), title, date: addDays(t, off), max, weight, category, created: Date.now() };
    c.columns.push(col); c.grades[col.id] = {};
    c.students.forEach((s, i) => { c.grades[col.id][s.id] = i === 3 && off === -7 ? 'ABS' : Math.round(max * (0.35 + ((((i * 37 + off * 13) % 60) + 60) % 60) / 100) * 2) / 2; });
  }
  c.cpc = { enabled: true, points: 20, events: [], self: {} };
  const keys = ['bulb', 'speech', 'ear', 'rings', 'pencil', 'book', 'nospeak', 'stop'];
  c.students.forEach((s, i) => { for (let k = 0; k < (i * 5) % 7; k++) c.cpc.events.push({ id: uid(), sid: s.id, k: keys[(i * 3 + k * 5) % (k % 3 === 2 ? 8 : 5)], date: addDays(t, -((i + k) % 10), true), t: k }); });
  for (let k = 1; k <= 4; k++) {
    const d = addDays(t, -k, true); c.attendance[d] = {};
    c.students.forEach((s, i) => c.attendance[d][s.id] = { s: (i + k) % 9 === 0 ? 'A' : (i * k) % 11 === 5 ? 'R' : 'P', n: '' });
  }
  c.journal.push({ id: uid(), date: addDays(t, -1, true), period: '2e heure', title: 'Le passé composé', content: 'Rappel de la formation (auxiliaire + participe passé).\nExercices p. 42 n° 1 à 4 en classe.', homework: 'Exercices p. 43 n° 5 et 6', due: addDays(t, 2, true), attachments: [] });
  c.journal.push({ id: uid(), date: addDays(t, -3, true), period: '4e heure', title: 'Lecture suivie — chapitre 3', content: 'Lecture à voix haute et questions de compréhension.', homework: '', due: '', attachments: [] });
  c.dossier.push({ id: uid(), sid: c.students[3].id, date: addDays(t, -5), type: 'Aménagement raisonnable', text: 'Temps supplémentaire (+1/3) lors des évaluations écrites. Police agrandie pour les consignes.', follow: 'Faire le point avec le CPMS en fin de période.', attachments: [] });
  c.dossier.push({ id: uid(), sid: c.students[0].id, date: addDays(t, -2), type: 'Point fort', text: 'Très bonne participation orale, aide spontanément ses camarades.', follow: '', attachments: [] });
  return c;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = A[el.dataset.act];
  if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList.contains('gin')) return onGradeChange(t);
  if (t.id === 'att-date') { if (t.value) { S.ui.attDate = t.value; save(); renderMain(); } return; }
  if (t.classList.contains('att-note')) { const c = cls(), d = S.ui.attDate || todayISO(); const e2 = c.attendance[d]?.[t.dataset.sid]; if (e2) { e2.n = t.value.trim(); save(); } return; }
  if (t.dataset.dx) return dxChange(t);
  if (t.dataset.bsp) { if (t.value) { S.settings.daccePeriods[+t.dataset.bsp][t.dataset.bf] = t.value; save(); } return; }
  if (t.dataset.arfield) {
    const s = studentByUI(); if (!s) return;
    s.ar ||= { motif: '', liste: [], source: '', note: '' };
    const f = t.dataset.arfield;
    s.ar[f] = f === 'liste' ? t.value.split('\n').map(x => x.replace(/^\s*[-•]\s*/, '').trim()).filter(Boolean) : t.value.trim();
    if (f === 'liste' && s.ar.liste.length && /compl|recopi|attente/i.test(s.ar.note || '')) s.ar.note = '';
    if (!hasAR(s) && !s.ar.source) delete s.ar;
    save(); const y = $('#view').scrollTop; renderMain(); $('#view').scrollTop = y; return;
  }
  if (t.dataset.sfield) {
    const s = studentByUI(); if (!s) return;
    s[t.dataset.sfield] = t.value.trim(); save();
    if (['lastName', 'firstName', 'birth'].includes(t.dataset.sfield)) { renderSidebar(); const y = $('#view').scrollTop; renderMain(); $('#view').scrollTop = y; }
    return;
  }
  if (t.dataset.setting) {
    const k = t.dataset.setting;
    S.settings[k] = t.type === 'checkbox' ? t.checked : ['scale', 'pass', 'bulletinScale'].includes(k) ? (Number(t.value) || defaultState().settings[k]) : t.value.trim();
    save(); applyTheme(); renderSidebar(); return;
  }
  if (t.dataset.period) {
    const p = S.settings.periods[+t.dataset.period], f = t.dataset.pf;
    p[f] = f === 'weight' ? (parseFloat(t.value.replace(',', '.')) >= 0 ? parseFloat(t.value.replace(',', '.')) : 1) : t.value.trim();
    save(); return;
  }
  if (t.dataset.cpc) {
    const n = parseFloat(t.value.replace(',', '.'));
    if (Number.isFinite(n) && n >= 0) S.settings.cpc[t.dataset.cpc] = n; else t.value = S.settings.cpc[t.dataset.cpc];
    save(); return;
  }
  if (t.dataset.cpci) {
    const it = S.settings.cpc.items[+t.dataset.cpci], f = t.dataset.cf;
    if (f === 'pts') { const n = parseInt(t.value, 10); if (Number.isFinite(n)) it.pts = n; t.value = it.pts; }
    else if (t.value.trim()) it[f] = t.value.trim();
    save(); return;
  }
  if (t.dataset.icon) {
    const ic = S.settings.icons[+t.dataset.icon], f = t.dataset.if;
    if (f === 'pct') { const n = Number(t.value); ic.pct = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : ic.pct; t.value = ic.pct; }
    else if (t.value.trim()) ic[f] = t.value.trim();
    save(); return;
  }
  if (t.dataset.filter) { S.ui[t.dataset.filter] = t.value; save(); renderMain(); }
});
document.addEventListener('input', e => { if (e.target.dataset?.dx === 'com') { const n = $('#dx-count'); if (n) n.textContent = e.target.value.length; } });
document.addEventListener('focusin', e => { if (e.target.tagName === 'INPUT' && e.target.classList.contains('gin')) setTimeout(() => e.target.select(), 0); });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (!t.classList?.contains('gin')) return;
  const r = +t.dataset.r, c = +t.dataset.c;
  const move = { Enter: [1, 0], ArrowDown: [1, 0], ArrowUp: [-1, 0] }[e.key];
  if (!move) return;
  e.preventDefault();
  const next = $(`.gin[data-r="${r + move[0]}"][data-c="${c + move[1]}"]`);
  if (next) next.focus(); else t.blur();
});
async function showStorageEstimate() {
  try {
    const est = await navigator.storage?.estimate?.();
    const el = $('#storage-est');
    if (est && el) el.textContent = ` · ${fmtSize(est.usage || 0)} utilisés`;
  } catch {}
}

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
